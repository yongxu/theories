# The reader's site (tools/publishing/build_site.py): built from main's allow-list (site.pages in
# _process/research-config.json) and deployed to GitHub Pages. It runs only when dispatched by hand (Actions → Site → Run
# workflow): publishing is a decision, so no push deploys it. Enabling Pages for the repository (Settings → Pages →
# Source: GitHub Actions) comes first. Only a run from main builds; only the deploy job holds the rights to publish. The checkout fetches only the blobs the build reads; nothing it builds is committed.
name: Site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.md
            /tools/
            /theories/
            /_process/research-config.json
            /_process/navigation/
            /experiments/README.md
      - name: Test the site builder
        run: python3 -B -m unittest tools.research.tests.test_site
      - name: Build the site
        run: python3 -B tools/publishing/build_site.py --out _site --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
