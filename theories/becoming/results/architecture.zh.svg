<title id="arch-title">生灭变化之论——核验层级（A–D）与认知边界</title>
<desc id="arch-desc">支撑生灭变化之论三协同层的四重核验层级图：层级 A 为零公理关系核心（439 闭包、418 核心模块、31,228 声明、22,087 定理、0 公理），由单一关系之根经五条共律与六大结构支柱汇入 AlignmentSpine、MasterSpine 与 SharpnessSuite；层级 B 为隔离的 18 模块外围（16 个 Mathlib v4.30.0-rc2 + 2 个非 Mathlib v4.29.1，0 过期），锚定共享基叶 FiniteProbKrylov，并列零公理独立轨 BecomingSpec（26 目标）、EncounterEntry（35 定理）与 RelSpanEncounterAdapter（7 定理）及 Mathlib 支撑的对偶轨；规则二（Rule 2）识别边界；层级 C 为拟制 6 项守卫对齐运行时（AI 拟制手设旗标自评）与失败先报的经验/压力壁垒（66 绑定检验中 4 败 20 混 5 过 37 其他、B4 25–50% 崩溃、B5 4/11 预测失败、Wave 2 B1/B2 边界、16/16 证据重放）；虚线深红 not_entails 防火墙（在至少一立场与一形成前提下，无只读动力学可满足律对一切意义蕴涵 Unrestricted）；层级 D 为第 3 层“生生”伦理、1,183 条智慧对照表与待人工冷读边界。</desc>
