<text x="24.0" y="58.0" font-size="13" text-anchor="start" fill="#6d6355">Drawn from the atlas&#x27;s entries alone: an arrow counts recorded exits between two families, not a route.</text>
<text x="24.0" y="78.0" font-size="13" text-anchor="start" fill="#6d6355">Read for premises and exits: A, B, C, D, E, F, G and H.</text>
