<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1110" width="900" height="1110" role="img" aria-labelledby="ts-title ts-desc" font-family="Helvetica, Arial, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, sans-serif">
<title id="ts-title">The terrain: where the atlas&#x27;s families of dynamics lead</title>
<desc id="ts-desc">Drawn from the atlas&#x27;s entries alone. Each of the eight boxes is a family of dynamics, with its count. Each arrow counts the recorded exits from a dynamic of one family to a dynamic of another: 22 such exits a law places, drawn solid, and 4 that no law shows (argued, conjectured, a reading or open), drawn dashed. Inside each box are the exits that stay within the family and those whose destination is a state said in words. Families C and D are read for the premises their laws take and where their exits lead; the families drawn dashed are not yet read so, their exits as first entered. An arrow is an exit, not a route: nothing here checks that one exit&#x27;s destination meets the next one&#x27;s conditions, ranks courses, or says where a course should go.</desc>
<defs><marker id="ts-law" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fbf"/></marker><marker id="ts-reading" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58a00"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="1109" rx="10" fill="#fcfcfb" stroke="#d6d3d1"/>
<text x="24.0" y="36.0" font-size="18" font-weight="bold" text-anchor="start" fill="#1e1a15">The terrain: where the atlas&#x27;s families of dynamics lead</text>
<text x="24.0" y="58.0" font-size="13" text-anchor="start" fill="#6d6355">Drawn from the atlas&#x27;s entries alone: an arrow counts recorded exits between two families, not a route.</text>
<text x="24.0" y="78.0" font-size="13" text-anchor="start" fill="#6d6355">Read for premises and exits: C and D. Dashed boxes: not yet read, their exits as first entered.</text>
