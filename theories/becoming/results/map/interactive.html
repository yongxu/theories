<script>
const D = {"lead":{"en":"A map of how anything forms, lasts, changes and ends, drawn so that people and AI can see the way together. Its first path: a selection (a reward, a judge, a market, a training run) can use up something while how much is left of it makes no difference to it, and whatever lives on that thing bears the loss; where each update sets its rule again from the shares selected under it, the rule can lock; and in built examples the using up removes those that would have counted the loss. One way out is proved from conditions on the loss and the judgments alone (step 9, with its conditions): where the rest count the loss, and the judgments together go against what the rule favoured at two updates running, the rule turns. No theorem drawn says what brings a loss to get back to those the rule is set from, or to be counted. Every other way out drawn is proved only with a further premise (how the rule is set, what is measured or allowed, or where the loss falls), or is shown only in a built example or as a reading.","zh":"这张图画的是：任何东西怎样生成、延续、变化、终结；画出来，是为了人和 AI 能一起看清路。第一条路：一个选择（奖励、评委、市场、训练）可能耗掉某样东西，而那东西还剩多少对它不造成差别，承受损耗的是靠那东西延续的；规则若每次重定都照着在它之下选出的份额来定，就可能定住；在造出来的例子里，这样耗下去，还清走了本来会把损耗算进去的。有一条出路只凭关于损耗和判断的条件就得到证明（第 9 步，连同它的条件）：其余的把损耗算进去，合起来的判断接连两次重定都不利于规则原先偏向的一方，规则就转向。损耗怎样才传得回定规则所依的各方、怎样才被算进去，图上的定理没有说。图上其余的出路，或者另需一个前提才得到证明（规则怎样定，量什么、允许什么，或者损耗落在哪里），或者只见于造出来的例子，或者只是一种解读。"},"bands":[{"id":"A","en":"What it lives on","zh":"靠什么延续"},{"id":"B","en":"What the selecting goes by","zh":"选择凭什么"},{"id":"C","en":"A view and how things are","zh":"看法与实情"},{"id":"D","en":"Between things that keep going","zh":"彼此之间"},{"id":"E","en":"Of anything that keeps going","zh":"凡是延续的"}],"web":[{"en":["what takes","takes from","what is lived on"],"zh":["取的一方","取","所靠的存量"],"rows":["b0","a1"]},{"en":["what gives back","gives back to","what is lived on"],"zh":["补的一方","补","所靠的存量"],"rows":["a1"]},{"en":["what lives on it","needs","what is lived on"],"zh":["靠它延续的","需要","所靠的存量"],"rows":["a2"]},{"en":["what is lived on","reaches, or lies beyond","a rule"],"zh":["所靠的存量","传得到，或者传不到","规则"],"rows":["b2"]},{"en":["a rule","picks among, and is set from","what it picks among"],"zh":["规则","在它们之间取舍，又由它们来定","被取舍的"],"rows":["b1","bs"]},{"en":["a rule","is set through","what counts when it is set"],"zh":["规则","经由它们来定","定规则时算数的"],"rows":["b3"]},{"en":["a view","is of, and is revised by","how things are"],"zh":["看法","说的是它，又照它来改","实情"],"rows":["c1"]},{"en":["something that keeps going","leans on, gives to, waits on","another"],"zh":["延续着的","靠着，给，等","另一个"],"rows":["d0","d1"]},{"en":["something that keeps going","lasts through","what carries it"],"zh":["延续着的","靠它们一茬茬传下去","承载它的"],"rows":["d2","d3"]}],"rows":[{"id":"b0","en":"Whether what is spared comes back to the one that spared it","zh":"留下的回不回得来","band":"A"},{"id":"a1","en":"What is taken against what comes back","zh":"取的与补的","band":"A"},{"id":"a2","en":"What lives on it","zh":"靠它延续的","band":"A"},{"id":"b1","en":"Where the rule comes from","zh":"规则从哪里来","band":"B"},{"id":"b2","en":"Whether what is used up gets back to the rule","zh":"用掉的传不传得到规则","band":"B"},{"id":"b3","en":"What the rule is set from","zh":"规则照什么来定","band":"B"},{"id":"bs","en":"Whether shaping the rule keeps the shapers' share","zh":"改规则保不保得住份额","band":"B"},{"id":"c1","en":"How a view meets how things are","zh":"看法怎么对上实情","band":"C"},{"id":"d0","en":"How they depend on one another","zh":"彼此怎么靠着","band":"D"},{"id":"d1","en":"Giving that waits on giving","zh":"先给还是先等","band":"D"},{"id":"d2","en":"Lasting through what carries it","zh":"一茬接一茬","band":"D"},{"id":"d3","en":"How many ways are in use","zh":"用几种做法","band":"D"},{"id":"e1","en":"Whether what it does comes back","zh":"所做的会不会绕回自己","band":"E"},{"id":"e2","en":"How much comes back each turn","zh":"回来的是多是少","band":"E"}],"conds":{"b0.pays":{"id":"b0.pays","row":"b0","col":2,"en":"What it spares comes back to it","zh":"留下的还归自己","says_en":"What a taker leaves returns to that same taker at least one for one: nothing else takes it first, and it regrows faster than later is counted down. Some best move then leaves something standing.","says_zh":"取用的一方留下多少，日后至少原样归它自己：没有别的先拿走，留下的长得也快过“以后”要打的折扣。这时最好的做法里，总有留下一些的。","eg_en":"Such as a family's own woodlot: a tree spared this year is theirs to cut, larger, next year.","eg_zh":"比如自家的林子：今年留下的树，明年更大，还是自家砍。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":78.0,"anchors":["Optimum.InTurn.kept_returns","Optimum.frontier_leaves","Optimum.weighted_holding_frontier","Optimum.AtOnce.whole_not_drained"],"dynamics":["others-drawing-first-end-the-base","a-weighting-faster-than-renewal-ends-the-base"]},"b0.together":{"id":"b0.together","row":"b0","col":3,"en":"Each takes little, together too much","zh":"各自不多，合起来超了","says_en":"Each one's taking is within its limit, or changes nothing by itself, yet all the taking together is more than comes back. No single count shows it.","says_zh":"各自取的都不出格，或者单看哪一个都改变不了什么，合起来却比补回来的多。各自的账上都看不出来。","eg_en":"Such as a lake where every boat keeps to a modest catch and the fleet together takes more than the lake breeds.","eg_zh":"比如湖上每条船捕得都不多，整支船队合起来却超过了湖里长的。","known_en":["Parfit, \"Five Mistakes in Moral Mathematics\" (Reasons and Persons, 1984, ch. 3)","The tragedy of the commons as a trap of missing feedback (Meadows, Thinking in Systems)"],"known_zh":["帕菲特《理与人》第三章：“道德数学中的五个错误”","公地悲剧：少了反馈的陷阱（梅多斯《系统之美》）"],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":78.0,"anchors":["Flow.WithinOwn","Flow.WithinJoint","Pair.own_not_joint","Dependence.DifferenceOnlyTogether","Flow.Balances.broken_shared"],"dynamics":["joint-difference-making","the-rest-outruns-the-renewal"]},"b0.lost":{"id":"b0.lost","row":"b0","col":4,"en":"What it spares is lost to it","zh":"留着不如拿走","says_en":"What a taker leaves comes back to it as less than taking it now would give: others take it first, or later counts for less. So each takes all it can.","says_zh":"留下的，归自己时不如现在就拿：别的会先拿走，或者“以后”不值那么多。于是各自能拿多少拿多少。","eg_en":"Such as open grazing land, where grass one herd spares is eaten by the next.","eg_zh":"比如公共草场：这群牛留下的草，下一群吃掉。","known_en":["Hardin, \"The Tragedy of the Commons\" (1968)","Wang Yangming, Chuanxilu 《傳習錄》, the 拔本塞源 passage: 「相矜以知，相軋以勢」 (vying with one another in knowledge, crushing one another by power: knowledge in a race for position serves the race)"],"known_zh":["哈丁：公地悲剧","王阳明《传习录》（拔本塞源论）：相矜以知，相轧以势"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":78.0,"anchors":["Optimum.AtOnce.ReturnsLess","Optimum.AtOnce.drains","Optimum.InTurn.floor_of_less","Optimum.frontier_exhausts"],"dynamics":["joint-difference-making","the-rest-outruns-the-renewal","a-race-for-position-draws-everything"]},"a1.new":{"id":"a1.new","row":"a1","col":1,"en":"Always something new","zh":"总有新的","says_en":"What can come about from here keeps growing. That needs more to come than goes, and something that was held fixed to keep changing.","says_zh":"从这里能生出来的越来越多。要这样，来的必须比去的多，原先固定不变的东西也必须不断地变。","eg_en":"Such as a craft whose tools keep making new tools possible.","eg_zh":"比如一门手艺，工具又造出新的工具。","known_en":["Open-ended evolution (artificial-life research)"],"known_zh":["开放式演化（人工生命研究）"],"unlike_en":["Bergson, \"The Possible and the Real\" (1930)"],"unlike_zh":["柏格森：可能与现实"],"x":256.0,"y":174.0,"anchors":["Web.KeepsWidening","Reaching.KeepsWidening","Web.KeepsWidening.rises_late","Run.changes_of_heldKeepsWidening"],"dynamics":["where-the-possible-grows","what-keeping-widening-needs"]},"a1.up":{"id":"a1.up","row":"a1","col":2,"en":"More comes than goes","zh":"越积越多","says_en":"More comes to it than goes from it, so it rises, or rises again after a fall. A rise always has a giver.","says_zh":"来的比去的多，所以在涨，或者跌过之后又长回来。凡是涨，总有给的一方。","eg_en":"Such as a field left fallow, or savings paid into every month.","eg_zh":"比如休耕的地，或者每月往里存的钱。","known_en":["Open systems kept in order by what flows through (Schrödinger, What Is Life?; Nicolis and Prigogine)"],"known_zh":["开放系统：秩序靠流过的东西维持（薛定谔、普里高津）"],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":174.0,"anchors":["Web.Rises","Flow.net_give_raises_at","Flow.restores","Flow.Balances.gives_more_of_rise","Flow.rise_from_rest_or_open","Flow.rise_given_by_supported"],"dynamics":["falls-that-end-do-not-recur","returning-novelty-forgetting-on-levels","an-arrow-leaves-change-not-recurring","where-a-run-of-a-regime-comes-to-rest","closing-needs-net-draw","ceasing-needs-arising","supported-renewal-recovery","never-leaving-a-guard"]},"a1.within":{"id":"a1.within","row":"a1","col":3,"en":"Taking within what comes back","zh":"用的补得上","says_en":"What is taken is no more than what comes back, so its level holds. This can go on for as long as the giving does.","says_zh":"取的不超过补回来的，存量不降。只要还有补的，就能一直这样下去。","eg_en":"Such as a woodlot cut each year by no more than it grows.","eg_zh":"比如一片林子，每年砍的不超过长的。","known_en":["Ostrom, Governing the Commons: communities keep a commons under rules they revise"],"known_zh":["奥斯特罗姆《公共事物的治理之道》：社群用自己能改的规则守住公共资源"],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":174.0,"anchors":["Flow.WithinJoint","Flow.joint_keeps","Web.Renewed","Flow.uptake_needs_replenishment","Flow.fed_beyond_level_at","Optimum.Keeps","Web.Kept","Web.RenewingIn"],"dynamics":["consumption-ends-with-feeders","a-cascade-along-total-dependence","ending-laws-as-regimes-on-a-lineage","slowing-down-before-an-own-end","market-model-share-margin-and-ends","margin-of-a-regime","threshold-in-the-state-plane","own-count-misses-joint-excess","what-taking-all-excludes","re-optimizing-above-a-renewal-ends-it","horizon-optima-hold-the-greatest-renewal","what-a-rise-draws-from-beyond","where-a-rising-take-ends","position-does-not-protect","whole-drawing-beyond-renewal-ends","continued-change-needs-openness","rest-at-every-resolution","a-coupling-saturated-by-what-it-has-carried","unceasing-generation-needs-renewal","ceasing-needs-arising","a-step-coupling-keeps-at-every-horizon","a-rule-rebuilt-from-the-members-it-limits"]},"a1.over":{"id":"a1.over","row":"a1","col":4,"en":"Taking more than comes back","zh":"用得比补得快","says_en":"More is taken than comes back, so its level falls. What is on hand sets how long this can last. No rule need be involved.","says_zh":"取的比补的多，存量在降。还剩多少，决定了能撑多久。有没有规则，都可能这样。","eg_en":"Such as a well pumped faster than the rain refills it.","eg_zh":"比如一口井，抽得比雨水补得快。","known_en":["The Limits to Growth (Meadows and others, 1972): overshoot; and Senge's \"limits to growth\" archetype"],"known_zh":["《增长的极限》（梅多斯等，1972）：过冲；圣吉的“成长上限”基模"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":174.0,"anchors":["Flow.WithinJoint","Flow.excess_lowers","Flow.excess_bounded","Optimum.ends_within","Flow.Overdraws","Web.course_lost_iff","Flow.Balances.unfed_consumption_ends","RuleRebuilding.«恒取逾生则尽»"],"dynamics":["market-finite-support-obstruction","joint-difference-making","what-a-rise-draws-from-beyond","whole-drawing-beyond-renewal-ends","closing-needs-net-draw","continued-change-needs-openness","rest-at-every-resolution","rest-exactly-where-falls-stop","least-loss-rest","copying-from-a-stock","recoverable-mediated-change","formed-goal-revision-continuation"]},"a1.past":{"id":"a1.past","row":"a1","col":5,"en":"Past turning back","zh":"回不了头了","says_en":"From here no course still open keeps what is being lost. Under the take as it stands the level runs down to nothing; where what gives to it lives on it too, even taking nothing does not bring it back.","says_zh":"到了这一步，还走得通的路里没有一条留得住正在失去的。取用照旧，存量就一路降到零；要是补给它的也靠它延续，那就一点不取也回不来。","eg_en":"Such as a fish stock below what it can recover from.","eg_zh":"比如鱼群少到了恢复不了的地步。","known_en":["Alternative stable states and tipping points (ecology)","Guoyu 《國語·周語下》, a proverb: 「從善如登，從惡如崩」 (going toward the good is a climb, toward the bad a landslide)"],"known_zh":["多重稳态与临界点","《国语·周语下》：从善如登，从恶如崩"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":174.0,"anchors":["NoReturnAt","RegimeMargin.ends_below","RegimeMargin.ends_iff_below","Flow.stays_below","Optimum.gated_stays_below","Web.Lost","Recoverable","NoReturnAt.recoverable_iff"],"dynamics":["margin-of-a-regime","a-cascade-along-total-dependence","threshold-in-the-state-plane","two-sided-regulation-and-late-reading","loss-read-in-time-by-the-others"]},"a2.supplied":{"id":"a2.supplied","row":"a2","col":3,"en":"Has what it needs","zh":"够用","says_en":"What it needs is there at each step, so it can go on.","says_zh":"每一步要用的都有，所以能延续下去。","eg_en":"Such as a herd on a pasture that regrows.","eg_zh":"比如草长得回来的牧场上的一群牛。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":270.0,"anchors":["Web.Supported","Web.Kept","Web.Renewed","Web.Dependent"],"dynamics":[]},"a2.short":{"id":"a2.short","row":"a2","col":4,"en":"Short of what it needs","zh":"不够用了","says_en":"What it needs has fallen below its need, or is cut off. It goes on only from what it has stored, while that lasts.","says_zh":"要用的不够了，或者断了。只能靠存下的撑着，撑到存的用完。","eg_en":"Such as a herd on overgrazed pasture, living on its fat.","eg_zh":"比如牧场啃秃了，牛群靠身上的膘撑着。","known_en":["Jonas, The Phenomenon of Life: metabolism and needful freedom"],"known_zh":["约纳斯：代谢与“有所需的自由”"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":270.0,"anchors":["Web.Broken","Web.Supported","Web.Carries","Web.Carries.pos","Web.Carries.ends_within","ConditionalWeights.fallsTo"],"dynamics":["a-reader-rebuilt-from-its-stock-ends-with-it","market-finite-support-obstruction","never-leaving-a-guard","succession-on-a-funded-carrier"]},"a2.else":{"id":"a2.else","row":"a2","col":5,"en":"Keeps going as something else","zh":"还在，但已不是原样","says_en":"It goes on after what it lived on fell short, because it now needs that thing less or not at all. What it left behind is not thereby given back.","says_zh":"原先靠的东西不够了，它还在延续，因为它不那么需要、或者不再需要那东西了。被它留在身后的，并没有因此补回来。","eg_en":"Such as a town that turns to other work after its mine is worked out.","eg_zh":"比如矿采完了，镇子改做别的营生。","known_en":["Fixes that fail (Senge, The Fifth Discipline)"],"known_zh":["饮鸩止渴（圣吉《第五项修炼》的系统基模）"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":270.0,"anchors":["Web.consumed_continues_transformed","Web.Dissolves","Web.Forms","Substitution.persists_consuming"],"dynamics":["substitution-preserves-consumption","ending-laws-as-regimes-on-a-lineage"]},"a2.ended":{"id":"a2.ended","row":"a2","col":6,"en":"Ended","zh":"尽了","says_en":"Nothing of it goes on: no successors, or what it needed is no longer there.","says_zh":"它不再延续：没有后继，或者它需要的已经没有了。","eg_en":"Such as a fishery closed because nothing is left to catch.","eg_zh":"比如没鱼可捕，渔场关了。","known_en":["Josiah and the law found in the temple (2 Kings 22-23)"],"known_zh":["约西亚王时在圣殿里发现律法书（《列王纪下》22–23章）"],"unlike_en":[],"unlike_zh":[],"x":1056.0,"y":270.0,"anchors":["Web.Ends","Flow.ends_below","Web.consumed_ends_when_fixed","Web.ended_for_good","Web.Broken","Web.Dependent","RemovesLine","SelectionTerm.Generations.Persists"],"dynamics":["a-rule-with-no-holder-does-not-return","a-reader-rebuilt-from-its-stock-ends-with-it"]},"b1.outside":{"id":"b1.outside","row":"b1","col":2,"en":"Not set from what it selects","zh":"不照它选出的来定","says_en":"What is selected under the rule makes no difference to the rule. Where being favoured never lowers a share, whatever it favours does not lose share, and only a change to the rule changes which side that is.","says_zh":"在规则之下选出什么，对规则不造成差别。只要受偏向从不压低份额，规则偏向哪一方，哪一方的份额就不降；只有规则变了，这一方才会换成另一方。","eg_en":"Such as an entrance exam set by a ministry: schools fill with those good at that exam.","eg_zh":"比如部里统一出的入学考试：学校里都是会考这个试的。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":406.0,"anchors":["Pace.rule_kept","Pace.rule_unreached","share_rises"],"dynamics":["fixation-by-drift","selection-among-groups-by-ending"]},"b1.swing":{"id":"b1.swing","row":"b1","col":3,"en":"Set from the share, not yet locked","zh":"照份额定，还没定住","says_en":"Each update sets the rule again from the shares selected under it, and neither side is locked: the rule can swing back and forth without settling.","says_zh":"规则每次重定都照着在它之下选出的份额来定，但哪一边都还没定住，可能来回摆。","eg_en":"Such as a ranking refit each week that keeps flipping between two leaders.","eg_zh":"比如每周重排的榜单，两个领先的换来换去。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":406.0,"anchors":["Pace.rule_at_reading","RuleCapture.Alternating.alternates","RuleCapture.Alternating.never_locked"],"dynamics":[]},"b1.held":{"id":"b1.held","row":"b1","col":4,"en":"Locked","zh":"定住了","says_en":"What is selected next follows from what has been selected: the favoured side's share and the rule that favours it each keep the other from falling. A change to the rule that leaves it favouring the same side is absorbed at the next update: the rule is set again from the share, no lower than before the change, and locked again.","says_zh":"下一步选出什么，由已经选出来的得出：受偏向的一方的份额和偏向它的规则，各自让对方降不下来。规则被改动了，只要它还偏向原来那一方，下一次重定就把改动消掉：规则照份额重定，不低于改动之前，又定住了。","eg_en":"Such as a keyboard layout: people learn it because machines have it, and machines have it because people learned it.","eg_zh":"比如键盘布局：机器这么排，所以大家这么学；大家这么学，所以机器这么排。","known_en":["The Matthew effect (Merton), in its generalised form: cumulative advantage","Fisherian runaway: a preference carried along with what it prefers (Fisher; Lande)"],"known_zh":["马太效应（默顿），取其推广的说法：优势累积","费希尔失控选择：偏好随它所偏好的性状一同传下去（费希尔；兰德）"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":406.0,"anchors":["RuleCapture.Locked","RuleCapture.ReadsShare","RuleCapture.locked_stays","RuleCapture.perturbation_absorbed","RuleCapture.Reversed.not_absorbed","ClosedCapture.reading_absorbed","DrawnShaping.drawn_locks","DrawnShaping.drawn_locked_either"],"dynamics":["a-prediction-read-by-what-it-predicts","capture-through-the-rule","readers-drawn-from-the-selected","shaping-the-rule-selected-by-what-comes-back","shaping-read-by-readers-drawn-from-the-selected","capture-by-counted-choices","habit-lock-in-active-inference","a-counter-rule-read-from-its-own-share","the-lock-draws-its-readers-out"]},"b2.counted":{"id":"b2.counted","row":"b2","col":2,"en":"The loss counts","zh":"损耗算进去了","says_en":"What used to make no difference to the rule now counts in how it is set, and past some amount the rule stops favouring what it favoured.","says_zh":"原先对规则不造成差别的，现在在定规则时算进去了；过了一定的量，规则就不再偏向原先偏向的一方。","eg_en":"Such as a quota now set from the state of the seabed as well as the catch.","eg_zh":"比如配额不只看捕捞量，也看海床的状况了。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":502.0,"anchors":["ClosedCapture.turned_by_loss (premise turns)","ClosedCapture.Thinned.lossPool","ReadInTime.shapedLossPool","ClosedCapture.Beyond.open_turned","Optimum.byGapThen","Optimum.counted_after_keeps_iff","ClosedCapture.turned_by_loss"],"dynamics":["keeping-forgoes-the-renewal-at-the-need","evidence-through-change"]},"b2.felt":{"id":"b2.felt","row":"b2","col":3,"en":"Gets back to the rule early enough","zh":"及时传到了","says_en":"What is being used up now makes a difference to something whose judgment enters the rule, while it can still be kept. Whether the rule then turns depends on how many they are and how early.","says_zh":"被耗掉的东西，在还留得住的时候，已经影响到了定规则的各方里至少一方。规则转不转，还要看它们有多少、来得多早。","eg_en":"Such as residents downstream who now sit on the board that sets the discharge limit.","eg_zh":"比如下游的居民进了定排放标准的委员会。","known_en":["Zuozhuan 《左傳·襄公三十一年》: 子產不毀鄉校 (Zichan keeps the village school where the government is judged)"],"known_zh":["《左传·襄公三十一年》：子产不毁乡校"],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":502.0,"anchors":["Web.ReadableInTime","Web.ReadsInTime","Web.FirstApart","Recoverable","ReadInTime.turned_iff (premise past)","ClosedCapture.Thinned.lossPool","NoReturnAt","Web.readableInTime_iff"],"dynamics":["every-loss-passes-a-juncture","selection-when-the-lumping-changes","formed-goal-revision-continuation"]},"b2.uncounted":{"id":"b2.uncounted","row":"b2","col":4,"en":"Used up; no change to the rule","zh":"耗掉了，规则不变","says_en":"Something is used up, and how much is left of it makes no difference to the rule. Outcomes that differ only in that are selected alike; what lives on that thing bears the loss.","says_zh":"有样东西在被耗掉，它还剩多少对规则不造成差别。只在这一点上不同的结果，选起来都一样；承受损耗的是靠那东西延续的。","eg_en":"Such as a catch quota met every year while the seabed that feeds the fish wears away.","eg_zh":"比如配额年年达标，养鱼的海床却在一点点磨掉。","known_en":["Goodhart's law, in its popular wording: a measure made a target stops being a good measure","The Great Learning 《禮記·大學》: 「與其有聚斂之臣，寧有盜臣」 (better a minister who steals than one who gathers revenue)"],"known_zh":["古德哈特定律（通行的说法：指标一成了目标，就不再是好指标）","《大学》：与其有聚敛之臣，宁有盗臣"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":502.0,"anchors":["Optimum.Rising","Optimum.Least","ClosedCapture.Unread","ClosedCapture.Accrues","Web.selects_alike_iff","ClosedCapture.unread_course","Web.ReadOffCouplings","Web.readOffCouplings_alike_iff"],"dynamics":["the-test-season-meets-the-optimum-laws","what-a-rise-draws-from-beyond","position-does-not-protect","a-break-read-only-by-threshold","a-pool-that-recruits-through-itself","readings-carried-and-filtered","formed-goal-revision-continuation","readings-revised-spread-and-locked","unselected-beyond-the-coupling-closure","what-an-optimum-does-beyond-what-couples-in"]},"b2.heard":{"id":"b2.heard","row":"b2","col":6,"en":"Gets back, but the lock stays","zh":"传到了，定局不改","says_en":"Some of the rest count the loss and are in the pool, and the rule goes on favouring what it favoured: they are too few, or began to count it too late.","says_zh":"其余的里面有一些把损耗算进去了，也在定规则所依的各方之中，规则却照旧偏向原先的一方：它们太少，或者算得太晚。","eg_en":"Such as a minority report filed every year and outvoted every year.","eg_zh":"比如年年提交、年年被否决的少数意见。","known_en":["Collingridge's dilemma of control (The Social Control of Technology, 1980)"],"known_zh":["科林格里奇困境"],"unlike_en":[],"unlike_zh":[],"x":1056.0,"y":502.0,"anchors":["ReadInTime.kept_iff","ReadInTime.kept_early_iff","ReadInTime.kept_once_favoured","ReadInTime.deadline","ClosedCapture.Thinned.kept_iff","ClosedCapture.Thinned.read_late_kept"],"dynamics":[]},"b3.list":{"id":"b3.list","row":"b3","col":1,"en":"A list fixed at the start","zh":"一开始就定下的名单","says_en":"The measure is taken over a fixed list of all that began, whatever is left.","says_zh":"衡量的对象是一开始就定下的全部名单，不管后来剩下哪些。","eg_en":"Such as a trial that counts every patient enrolled, including those who dropped out.","eg_zh":"比如临床试验把入组的每个病人都算上，中途退出的也算。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":256.0,"y":598.0,"anchors":["AllPersist","not_allPersist_of_removes"],"dynamics":[]},"b3.rest":{"id":"b3.rest","row":"b3","col":2,"en":"The rest judge too","zh":"其余的也在判断","says_en":"The rule is set from the judgments of both kinds, what it favours and the rest, each judging for its own.","says_zh":"规则由两边的判断一起定：受偏向的和其余的，各为自己判断。","eg_en":"Such as a board on which those downstream also sit.","eg_zh":"比如下游的也在委员会里有席位。","known_en":["Huang Zongxi 黃宗羲, Mingyi daifang lu 《明夷待訪錄·學校》: 「天子亦遂不敢自為非是，而公其非是於學校」 (the ruler then dares not settle right and wrong alone, and has them judged in common at the schools)"],"known_zh":["黄宗羲《明夷待访录·学校》：天子亦遂不敢自为非是，而公其非是于学校"],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":598.0,"anchors":[],"dynamics":[]},"b3.gone":{"id":"b3.gone","row":"b3","col":4,"en":"None left that would count the loss","zh":"会把损耗算进去的不在了","says_en":"Those that would have counted the loss have been removed by it, or were never in the pool. A measure taken only among what is left passes once the course settles, whatever was removed, and the rule is set as the share alone gives it, whatever the removed would have judged.","says_zh":"本来会把损耗算进去的，被损耗本身清走了，或者从来不在定规则所依的各方里。只在剩下的里面衡量，过程稳定下来以后，不管清走了什么都照样通过；规则只照份额给出的来定，不管被清走的本来会怎么判断。","eg_en":"Such as a workplace survey answered only by those who stayed.","eg_zh":"比如只有留下来的员工填的满意度调查。","known_en":["Guoyu 《國語·周語上》, Duke Shao warns King Li against silencing criticism: 「國人莫敢言」 (no one dared speak; the king read the silence as success)"],"known_zh":["《国语·周语上》邵公谏厉王弭谤：国人莫敢言"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":598.0,"anchors":["RemovesLine","RemovesItsReaders","SurvivorsPersist","survivorsPersist_of_settled","PoolFromCourse.Stands","ClosedCapture.Thinned.kept_iff","PoolFromCourse.ReadsThroughPresent","PoolFromCourse.window_removed_unregistered"],"dynamics":["the-lock-draws-its-readers-out","readings-revised-spread-and-locked","unselected-beyond-the-coupling-closure"]},"b3.inside":{"id":"b3.inside","row":"b3","col":5,"en":"Its updating follows the share too","zh":"怎样重定也跟着份额","says_en":"The rule and the way it is updated are both formed from the share of what the rule favours. A loss that changes neither what is selected next nor how the rule is set can grow without limit while the loop runs as it would with no loss. It is the lock, together with something used up that makes no difference to the rule. The account calls this the meta-attractor in its closed form.","says_zh":"规则和规则怎样重定，都由规则偏向的一方的份额形成。损耗只要既不改变下一步选出什么，也不改变规则怎样定，就可以一直涨，而这个圈照没有损耗时那样走。这就是定局，再加上一样在被耗掉、对规则却不造成差别的东西。这套理论把它叫作“元吸引子”；这是它合上以后的样子。","eg_en":"Such as a ranking refit to the clicks its own top results draw, its success measured by those same clicks.","eg_zh":"比如榜单照着自己榜首带来的点击重排，成效也用这些点击来衡量。","known_en":["Shangshu 《尚書·酒誥》: 「人無於水監，當於民監」 (look not in water for a mirror, but in the people)","Sen: adaptive preferences misreport deprivation"],"known_zh":["《尚书·酒诰》：人无于水监，当于民监","阿马蒂亚·森：适应性偏好报不出匮乏"],"unlike_en":["Fisherian runaway (Lande; Kirkpatrick), read as not the closed lock"],"unlike_zh":["费希尔失控选择（兰德；柯克帕特里克），这里读作不是合上了的定局"],"x":896.0,"y":598.0,"anchors":["ClosedCapture.Unread","ClosedCapture.readers","ClosedCapture.both_reads","ClosedCapture.lock_outlives_loss","RuleCapture.Locked","ClosedCapture.unread_course","ClosedCapture.readers_not_below","ClosedCapture.reading_absorbed"],"dynamics":["closed-capture"]},"b3.checkers":{"id":"b3.checkers","row":"b3","col":6,"en":"The checks follow what it favours","zh":"查错的跟着受偏向的一方走","says_en":"The ways a loss could come to count (courts, press, statistics, audit) are filled by what the rule favours, or breaking them is what the rule favours.","says_zh":"损耗本来可以经法院、报纸、统计、审计这些途径算进去；这些途径也由规则偏向的一方占着，或者，弄坏它们正是规则所偏向的事。","eg_en":"Such as an auditor chosen and paid by the firm it audits.","eg_zh":"比如审计师由被审计的公司挑、由它付钱。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":1056.0,"y":598.0,"anchors":[],"dynamics":[]},"bs.costs":{"id":"bs.costs","row":"bs","col":4,"en":"Shaping the rule loses share","zh":"改规则保不住份额","says_en":"Shaping the rule costs the shapers more than comes back to them alone, so the rule after it favours the others and, where any shapers are present, their share falls.","says_zh":"改规则，花掉的比单独回到改规则一方的多，所以改过之后的规则偏向别的各方；只要有改规则的一方在场，这一方的份额就下降。","eg_en":"Such as lobbying whose gains go to the whole industry while one firm pays for it.","eg_zh":"比如一家出钱游说，好处全行业分。","known_en":["Olson, The Logic of Collective Action: a shared benefit does not select those who pay for it"],"known_zh":["奥尔森：集体行动的逻辑"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":694.0,"anchors":["RuleShaping.shaped","RuleShaping.disfavours_iff","RuleShaping.falls_strictly","RuleShaping.nothing_back_falls"],"dynamics":["mutation-and-the-balance-it-sets","shaping-the-rule-selected-by-what-comes-back"]},"bs.pays":{"id":"bs.pays","row":"bs","col":5,"en":"Shaping the rule keeps share","zh":"改规则保得住份额","says_en":"Shaping the rule brings back to the shapers alone at least what it costs, so the rule after it favours them: their share does not fall and, where any are present, rises where it brings back more. By shaping, the shapers keep their share.","says_zh":"改规则，单独回到改规则一方的不少于花掉的，所以改过之后的规则偏向这一方：这一方的份额不降，只要有改规则的一方在场，回来的更多时还会涨。改规则的一方靠改规则保住份额。","eg_en":"Such as lobbying whose gains come back mostly to the firm that paid for it.","eg_zh":"比如谁出钱游说，好处大半回到谁手里。","known_en":["Stigler: regulatory capture, regulation acquired by the regulated"],"known_zh":["施蒂格勒：规制俘获"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":694.0,"anchors":["RuleShaping.shaped","RuleShaping.favours_iff","RuleShaping.le_select_iff","RuleShaping.lt_select_iff"],"dynamics":[]},"c1.open":{"id":"c1.open","row":"c1","col":1,"en":"Ruling out what does not fit","zh":"不合的一个个排除","says_en":"Several accounts still fit, and what comes back can tell them apart. Each answer can only remove; what is removed stays out unless a change is taken into the view.","says_zh":"还有几种说法都讲得通，回来的结果能把它们分开。每个结果只能排除；排除掉的不会回来，除非看法把一次变化算了进去。","eg_en":"Such as a doctor's list of possible causes, shortened by each test result.","eg_zh":"比如医生手里的几种可能病因，每出一项检查结果就划掉几个。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":256.0,"y":830.0,"anchors":["Courses.run_narrows","Courses.run_stays_iff","TemporalInspection.predict","TemporalInspection.prediction_contains_successor"],"dynamics":["learning-by-refutation","encounter-selection-and-revision"]},"c1.checked":{"id":"c1.checked","row":"c1","col":2,"en":"Checked against the thing itself","zh":"拿实际对过了","says_en":"The view has just been set beside what it is of, where it could have come out otherwise. It fits as of that look.","says_zh":"看法刚刚和它所说的实情对过，而且本来有可能对不上。就这一次对照来说，它是对的。","eg_en":"Such as a shop's stock list on the evening of the count.","eg_zh":"比如盘点当晚的库存单。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":830.0,"anchors":["ReadingLoop.Loop.kept_iff","ReadingLoop.Loop.faithful_kept","TemporalInspection.Known"],"dynamics":[]},"c1.old":{"id":"c1.old","row":"c1","col":3,"en":"Going by how it was","zh":"还按老样子看","says_en":"The view was right when it was taken. What it is of has changed since, the change did not enter the view, and nothing inside the view shows the difference.","says_zh":"看法在形成的时候是对的。后来实情变了，变化没进到看法里，看法自己也显不出差别。","eg_en":"Such as a map drawn before the river moved, still used to find the ford.","eg_zh":"比如河改道之前画的地图，还拿来找渡口。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":830.0,"anchors":["Generative.NormativeActivity.ClosedDomain","Generative.NormativeActivity.reachable_closed_disagreement","Generative.NormativeActivity.adaptive_closed_invariant"],"dynamics":["obscuration-and-reopening","adaptive-closure-cannot-resolve","correction-is-not-calibration"]},"c1.road":{"id":"c1.road","row":"c1","col":4,"en":"Keeps to the known road","zh":"只走熟路","says_en":"It chooses by its view, and what it chooses brings back only what the view expected. The view stands, right or wrong, though something it does not try would show which.","says_zh":"它照自己的看法来选，选出来的又只带回看法料到的结果。看法就这么立着，对也好错也好；它没试的那条路，本来能分出对错。","eg_en":"Such as a commuter who always takes the same road and so never learns whether the other one is faster.","eg_zh":"比如上班总走同一条路，永远不知道另一条是不是更快。","known_en":["Confirmation bias and positive testing (Wason; Klayman and Ha)"],"known_zh":["确认偏误与正向检验（Wason；Klayman 与 Ha）"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":830.0,"anchors":["ReadingLoop.Loop.rests_of_unrefuted","ReadingLoop.Untested.floor_forgoes","Run.not_fixes_of_untaken"],"dynamics":["what-a-course-chosen-through-its-model-does-not-test","a-stop-passed-by-a-listing-that-fixes-the-sign","what-training-installs","a-wrong-projection-admitted-at-every-step","encounter-selection-and-revision"]},"c1.same":{"id":"c1.same","row":"c1","col":5,"en":"Looks the same from here","zh":"从这儿看都一样","says_en":"Two states of things that differ give it the same of everything it takes in. So it treats them alike; telling them apart needs something it does not now have.","says_zh":"两种不同的情形，传到它这里的东西完全一样。所以它一样对待；要分开，得有它现在没有的东西。","eg_en":"Such as a fuel light that only comes on when the tank is empty: half full and nearly empty look the same.","eg_zh":"比如只在油箱见底时才亮的油量警示灯：半箱和快没了，看起来一样。","known_en":["Micaiah and the four hundred court prophets (1 Kings 22); unanimity held suspect (b. Sanhedrin 17a)"],"known_zh":["米该雅与四百宫廷先知：众口一词反而可疑"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":830.0,"anchors":["Blanket.Blanketed.agent_through_sensory","ReadingLoop.sensed_alike_iff","LumpedSeeking.Tied","Learning.Training.Through"],"dynamics":["what-a-commuting-law-keeps-apart","what-seeking-cannot-separate","a-cascade-at-the-histories-reached","a-reading-informed-and-revalued"]},"c1.nomeans":{"id":"c1.nomeans","row":"c1","col":6,"en":"Sees it, lacks the means","zh":"看出来了，没本钱改","says_en":"The difference is told apart, or the correction is known, but the act it calls for cannot be carried out: the stock, the parts or the link it needs are not there.","says_zh":"差别分出来了，或者知道该怎么改，但改不动：要用的存量、零件或者环节不在。","eg_en":"Such as a household that knows the roof leaks and has nothing left this month to mend it.","eg_zh":"比如知道屋顶漏了，这个月却拿不出钱修。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":1056.0,"y":830.0,"anchors":["Stock.product_feasible_iff","Stock.Covered","Revising.correction_enabled_iff","CalibrationRenewal.unfunded_revision_not_admitted"],"dynamics":["selection-when-the-lumping-changes"]},"d0.ring":{"id":"d0.ring","row":"d0","col":2,"en":"Each depends on the others","zh":"彼此都离不开","says_en":"What any one does can reach, at some remove, every other's going on, and so comes back to it. Taking counts as much as giving: this is contact, not kindness. Read in time, the reach can stop after some step.","says_zh":"哪一个做了什么，隔着几层，都影响得到其余每一个能不能延续，也就绕回它自己。取和给一样算：这说的是相连，不是善意。按时间先后看，这种相连可能到某一步就断了。","eg_en":"Such as the crew of one small boat far from shore.","eg_zh":"比如离岸很远的一条小船上的全体船员。","known_en":[],"known_zh":[],"unlike_en":["Mencius 3A.4 《孟子·滕文公上》: Xu Xing's 「賢者與民並耕而食」 (the worthy plough beside the people for their food), and Mencius' reply"],"unlike_zh":["《孟子·滕文公上》：许行“贤者与民并耕而食”，与孟子的回应"],"x":416.0,"y":966.0,"anchors":["Flow.MutuallyDependent","Flow.MutuallyDependent.reachReturns","Flow.MutuallyDependentInTime","Flow.MutuallyDependentFrom","Drawing.lapses","Drawing.returning_feeding_apart"],"dynamics":["mutual-dependence-and-its-pace","what-a-regularity-takes-in","growth-constrained-fragmentation"]},"d0.line":{"id":"d0.line","row":"d0","col":5,"en":"Held up wholly by another","zh":"全靠另一个撑着","says_en":"It goes on only while another does: once nothing is left of that one, nothing comes to it, and, drawn on at every step, it ends at once or when its store is used up. It need give nothing back to the one it leans on.","says_zh":"它只在另一个还在的时候延续：那一个一点不剩，它就什么也得不到；它每一步又都在被耗，于是立刻、或者等存的耗完，也就尽了。它不必给所靠的那一个什么回报。","eg_en":"Such as a parasite with a single host.","eg_zh":"比如只有一个宿主的寄生物。","known_en":["Coextinction and secondary extinctions (food-web ecology)"],"known_zh":["协同灭绝与次生灭绝（食物网生态学）"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":966.0,"anchors":["RegimeMargin.Coupled.Indexed.DependsOn","RegimeMargin.Coupled.Indexed.Downstream","RegimeMargin.Coupled.Indexed.ends_of_partner","RegimeMargin.Coupled.Indexed.Chain.stopped","Web.AllWhole","Founding.Flow.ConfinedRise"],"dynamics":["a-cascade-along-total-dependence"]},"d1.round":{"id":"d1.round","row":"d1","col":2,"en":"Giving goes round","zh":"有来有往","says_en":"Each gives because what it waits on gave, so the giving carries itself on. A lapse passes without spreading where each can do without as many as lapsed of those it waits on, or waits out a lapse shorter than its wait; where each needs all it waits on at the last step, a lapse is passed on.","says_zh":"各自都是所等的给了才给，于是给就这么接下去。要是各自所等的里面中断的那几个，它都少得起，或者中断比它肯等的步数短，中断就过得去、不传开；要是各自都得所等的上一步全给了才给，中断就往下传。","eg_en":"Such as neighbours who lend tools because the last loan came back.","eg_zh":"比如邻里之间借工具：上回借出去的还回来了，这回才肯借。","known_en":["The gift that binds and moves on (Kimmerer, Braiding Sweetgrass; Mauss, The Gift)"],"known_zh":["礼物结下关系，又传下去（基默尔《编结茅香》；莫斯《礼物》）"],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":1062.0,"anchors":["Withholding.answers","Tolerance.tolerating","Tolerance.kept_set","Tolerance.thin_absorbed","Withholding.gives_without_chain","WindowedWaiting.gives_unless_errs","Withholding.answers_closed","Withholding.withholding_spreads"],"dynamics":["thresholds-of-waiting","a-pair-tolerates-only-within-a-window"]},"d1.gap":{"id":"d1.gap","row":"d1","col":3,"en":"One link has dropped out","zh":"有一环没接上","says_en":"At least one has stopped giving while others still give. The gap is then passed over, or answered by what waits on it: carried down a line of waits and off its end, round a loop of waits for ever, or, where a lapse is never made up, spread for good to all it reaches along the waits.","says_zh":"至少有一个不给了，别的还在给。这个缺口要么就这么过去了，要么等着它的也跟着不给：顺着一串“等”传下去，传到头就没了；或者在一圈“等”里一直转；或者，要是中断永远补不回来，就传到顺着“等”够得着的每一个，从此都不给。","eg_en":"Such as one workshop missing a delivery in a chain where each needs the one before.","eg_zh":"比如一条链上各家都等上一家交货，有一家没交。","known_en":["Bhagavad Gītā 3.10-16: the wheel of food, rain and offering"],"known_zh":["《薄伽梵歌》3.10–16：食、雨、祭相续之轮"],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":1062.0,"anchors":["Tolerance.thin_absorbed","WindowedWaiting.errs_answered","Withholding.gives_without_chain","Withholding.withholding_returns","Withholding.Ring.answers_circulates","Withholding.waitsAll","Withholding.withholding_spreads"],"dynamics":[]},"d1.wait":{"id":"d1.wait","row":"d1","col":5,"en":"Each waits for the other","zh":"都等对方先给","says_en":"Nothing gives, because each gives only after another has. It stays so until something gives without waiting, or something already in hand is spent to start.","says_zh":"全都不给，因为各自都要等对方先给。会一直这样，直到有一个不等就给，或者拿手头现成的先垫上。","eg_en":"Such as two sides each ready to sign once the other has signed.","eg_zh":"比如双方都说：你先签，我就签。","known_en":["Double contingency (Parsons; Luhmann, Soziale Systeme)"],"known_zh":["双重偶联性（帕森斯；卢曼《社会系统》），又译双重偶然性"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":1062.0,"anchors":["Tolerance.allWithheld","Withholding.waitsAll","Tolerance.withheld_kept","Tolerance.total_stays","Tolerance.clear_loop_withholds","SeededContinuation.empty_never_starts","Tolerance.gives_needs_sparing","Withholding.waitsAll_withholding_stays"],"dynamics":[]},"d2.handed":{"id":"d2.handed","row":"d2","col":2,"en":"Handed on","zh":"换了一茬，格局还在","says_en":"The same pattern goes on while what carries it is replaced: it is handed on at least once in every stretch as long as one carrier lasts.","says_zh":"承载它的换了一茬又一茬，同一个格局还在：每过一茬那么长的时间，至少往下传了一次。","eg_en":"Such as a craft passed from master to apprentice, or an office whose way of doing things survives every change of staff.","eg_zh":"比如师傅传徒弟的手艺；或者一个办公室，人都换过了，做事的路数没变。","known_en":["Whitehead, Process and Reality: an enduring object as a society in serial order"],"known_zh":["怀特海：持存之物是有序相继的“社会”"],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":1158.0,"anchors":["Web.ByPassing","Web.ByPassing.passes_within","Web.PassesAt","Web.Present","Web.Brief"],"dynamics":["a-whole-of-every-part","a-pattern-lasts-through-passing","the-selection-term-and-a-lineages-fate","a-rule-rebuilt-from-the-members-it-limits","readings-carried-and-filtered"]},"d2.stalled":{"id":"d2.stalled","row":"d2","col":4,"en":"Stopped for want of one thing","zh":"缺一样，卡住了","says_en":"The next step cannot be taken because one needed thing is missing. What it is made of is still there, and it could go on if the missing thing came.","says_zh":"下一步走不了，因为缺一样要用的东西。它本身还在，缺的那样来了，就能接着走。","eg_en":"Such as a building site with every material delivered but one.","eg_zh":"比如工地上材料都到了，只差一样。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":1158.0,"anchors":["AlignmentSuccession.missing_part_blocks_realization","AlignmentSuccession.migration_funding_blocks_realization","AlignmentSuccession.enabled_step","Copying.copying_iff","OpenedCorrection.Linked.starved_uncorrectable","OpenedCorrection.Linked.opens_by_support","RecurrentAssembly.partial_failure_keeps_material"],"dynamics":["succession-on-a-funded-carrier"]},"d3.several":{"id":"d3.several","row":"d3","col":2,"en":"Several ways in use","zh":"各用各的","says_en":"More than one way is in use, or none yet, and not all have come to one.","says_zh":"在用的做法不止一种，或者一种都还没有；总之还没有都归到同一个上。","eg_en":"Such as two words for the same new thing, each heard about as often.","eg_zh":"比如同一样新东西有两个叫法，听到的次数差不多。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":1254.0,"anchors":["SharedCodes.AgreeAt","Drift.Replacement.Mixed","SharedCodes.agrees_every_start_iff","SharedCodes.never_agrees_of_both"],"dynamics":["fixation-by-drift","selection-among-groups-by-ending","what-a-commuting-law-keeps-apart","encounter-selection-and-revision","mutation-and-the-balance-it-sets"]},"d3.one":{"id":"d3.one","row":"d3","col":4,"en":"All on the same one","zh":"都用同一个","says_en":"Every member holds the same one, so copying only repeats it. Another returns only from outside the group or by being newly made.","says_zh":"每个成员用的都是同一个，互相学只是重复它。别的做法只能从外面来，或者新造出来。","eg_en":"Such as a word everyone now uses.","eg_zh":"比如一个现在人人都用的词。","known_en":[],"known_zh":[],"unlike_en":["Heraclitus: the one logos by which all comes to be, common to all (DK 22 B1, B2)"],"unlike_zh":["赫拉克利特：万物所依、为众所共的逻各斯"],"x":736.0,"y":1254.0,"anchors":["SharedCodes.AgreeAt","SharedCodes.agreement_kept","SharedCodes.run_kept_iff","SelectionTerm.Generations.fixed_of_present","SharedCodes.all_agree_rest","SharedCodes.held_stays","Drift.Replacement.value_one_kind"],"dynamics":["a-code-formed-between-formations","readings-revised-spread-and-locked"]},"d3.merged":{"id":"d3.merged","row":"d3","col":5,"en":"No longer told apart","zh":"分不出来了","says_en":"Two things once kept apart are now treated as one by everything inside. Nothing held inside can bring the difference back.","says_zh":"原先分开的两样东西，现在里面全都当成一样。里面留着的任何东西都找不回这个差别。","eg_en":"Such as two sounds a dialect has merged, which its speakers no longer hear as different.","eg_zh":"比如方言里合并了的两个音，说这种话的已经听不出区别。","known_en":["Huang Zongxi 黃宗羲, Mingyi daifang lu 《明夷待訪錄·田制三》: 「積累莫返之害」 (levies merged under one name, then the old ones charged again on top)"],"known_zh":["黄宗羲《明夷待访录·田制三》：积累莫返之害"],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":1254.0,"anchors":["SharedCodes.Loses","SharedCodes.impose_loses_iff","SharedCodes.run_imposed_stays","SharedCodes.outside_needed","SharedCodes.impose"],"dynamics":["merged-distinctions-stay-merged"]},"e1.line":{"id":"e1.line","row":"e1","col":2,"en":"Nothing it does comes back","zh":"只往下传，不回来","says_en":"What it does is passed on down the line and no chain of effects leads back to it.","says_zh":"它做的只往下游传，没有哪条因果的链子绕回它自己。","eg_en":"Such as a mill upstream of a town.","eg_zh":"比如镇子上游的一座磨坊。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":416.0,"y":1390.0,"anchors":["OnLoop","Upstream","gap_polynomial_iff_no_loop","ExchangeLaw.ReadsBelow.standing_no_loop"],"dynamics":[]},"e1.ring":{"id":"e1.ring","row":"e1","col":4,"en":"What it does comes back","zh":"做出去的又绕回自己","says_en":"A chain of effects leads back to where it started, so a difference can go round.","says_zh":"有一条因果的链子绕回起点，于是一点差别可以转着圈走。","eg_en":"Such as a microphone placed where it picks up its own loudspeaker.","eg_zh":"比如话筒摆在能收到自己音箱声音的地方。","known_en":["Sevenfold vengeance, eye for eye, payment, pardon and the other cheek (Genesis 4; Exodus 21; Qur'an 42:40; Matthew 5)"],"known_zh":["七倍报复、以眼还眼、赔偿、宽恕与“转过另一边脸”（《创世记》4；《出埃及记》21；《古兰经》42:40；《马太福音》5）"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":1390.0,"anchors":["OnLoop","onLoop_succ_iff","carriedWithin_lt_of_recurring_loop","gap_polynomial_iff_no_loop","LoopReturn.returnMap"],"dynamics":["whether-a-loop-closes-a-difference"]},"e2.rest":{"id":"e2.rest","row":"e2","col":1,"en":"At rest","zh":"不再变了","says_en":"From some point on nothing about it changes: nothing arises or ceases, no level rises or falls. It may rest at some level, or at nothing; an end is one way of resting.","says_zh":"从某一刻起，它什么都不再变：没有新生的，没有消失的，存量不涨不落。可以停在某个水平上，也可以停在零上；“尽了”是停下的一种。","eg_en":"Such as a pendulum that has stopped.","eg_zh":"比如停下来的钟摆。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":256.0,"y":1486.0,"anchors":["World.RestsFrom","Amounts.FallsStop","RegimeMargin.Adjusted.AtRest","World.InAmounts.change_stops_iff","RestsAt","Law.rests_iff","LoopReturn.stays_from_fixed"],"dynamics":["what-training-installs","laws-with-noise"]},"e2.good":{"id":"e2.good","row":"e2","col":2,"en":"Made good again","zh":"又补回来了","says_en":"From some step on, every push is against the departure and no larger than the gap. The gap then closes within as many steps as it is wide, and stays closed.","says_zh":"从某一步起，每一次推回都朝偏离的反方向，又不超过缺口。缺口至多经过它那么宽的步数就合上，并且一直合着。","eg_en":"Such as a tank that fills back to its line after each bucket is drawn.","eg_zh":"比如水箱，每舀走一桶，又补回到水位线。","known_en":["Laozi 77 《老子》七十七章: 「天之道，損有餘而補不足」 (Heaven's way takes from what has too much and adds to what has too little)"],"known_zh":["《老子》七十七章：天之道，损有馀而补不足"],"unlike_en":["Purpose as negative feedback (Rosenblueth, Wiener and Bigelow, 1943)"],"unlike_zh":["目的就是负反馈（控制论）"],"x":416.0,"y":1486.0,"anchors":["Flow.Opposes","Flow.WithinGap","Flow.gap_falls","Flow.settles_from","Flow.regulates","Flow.settles","LoopReturn.closes_within"],"dynamics":["two-sided-regulation-and-late-reading","never-leaving-a-guard","recoverable-mediated-change"]},"e2.round":{"id":"e2.round","row":"e2","col":3,"en":"Coming round again","zh":"转一圈又回来","says_en":"It keeps changing and keeps arriving back where it was. Where each link on the way passes on exactly what it gets, what goes round comes back whole at every turn.","says_zh":"它一直在变，又一直回到原来的地方。要是路上每个环节收多少就传多少，转着走的东西每一圈都原样回来。","eg_en":"Such as the seasons.","eg_zh":"比如四季。","known_en":["Mencius 3B.9 《孟子·滕文公下》: 「天下之生久矣，一治一亂」 (order and disorder in turn), and the five-hundred-year period (2B.13)"],"known_zh":["《孟子·滕文公下》：天下之生久矣，一治一乱；又“五百年必有王者兴”（《公孙丑下》）"],"unlike_en":[],"unlike_zh":[],"x":576.0,"y":1486.0,"anchors":["Branching.Returns","Law.Returns","Law.returns_iff","Net.cycle_never_rests","Settling.ChangesInLoop","Settling.keeps_changing_iff_loop","LoopReturn.loop_kept"],"dynamics":["every-loss-passes-a-juncture","ending-laws-as-regimes-on-a-lineage","necessarily-drawn-is-not-returning","a-cascade-along-total-dependence","withholding-returns-around-a-loop","closed-cycle-without-dissipation","lossless-exchange-continues-and-returns","support-beyond-a-band-can-cycle","a-run-round-a-loop-keeps-changing","recurrence-without-premise","returning-where-the-course-branches","recurrence-without-selector-revision","a-course-that-only-returns","recurring-at-fine-steps-quiet-at-coarser","becoming-return-grades","waxing-and-waning-returns","an-arrow-leaves-change-not-recurring","where-a-run-of-a-regime-comes-to-rest","unceasing-generation-needs-renewal"]},"e2.swing":{"id":"e2.swing","row":"e2","col":4,"en":"Swinging past the mark","zh":"来回摆，停不住","says_en":"Each correction goes too far or comes too late, so the mark is passed from both sides again and again.","says_zh":"每次纠正不是过了头，就是来得太晚，于是一次次从两边越过那个点。","eg_en":"Such as a shower turned hotter, then colder, because the water answers a few seconds late.","eg_zh":"比如淋浴调水温：水隔几秒才变，于是一会儿太烫，一会儿太凉。","known_en":["A balancing loop with delay oscillates (Forrester, Industrial Dynamics; Senge)","Zuozhuan 《左傳·昭公二十年》: 「寬以濟猛，猛以濟寬」 (leniency corrects severity, severity corrects leniency)"],"known_zh":["有延迟的调节回路会来回摆荡","《左传·昭公二十年》：宽以济猛，猛以济宽"],"unlike_en":[],"unlike_zh":[],"x":736.0,"y":1486.0,"anchors":["Flow.crosses_of_above","Flow.never_at_of_beyond","Regulation.Overshooting.oscillates","Flow.RelaysLate","Regulation.held_oscillates","Flow.crosses_of_below","Regulation.upCrossing_next","Regulation.downCrossing_next"],"dynamics":["a-map-moving-every-value-never-rests","overcompensating-giving-cycles","overshooting-thermostat-alternates","threshold-reading-read-late-alternates","publication-under-negation-alternates","late-relay-oscillates","two-sided-regulation-and-late-reading"]},"e2.grow":{"id":"e2.grow","row":"e2","col":5,"en":"Growing on itself","zh":"越滚越大","says_en":"What goes round comes back larger than it left, so each round starts from more.","says_zh":"转一圈回来的比出去的多，所以每一圈都从更多开始。","eg_en":"Such as interest paid on interest.","eg_zh":"比如利滚利。","known_en":[],"known_zh":[],"unlike_en":[],"unlike_zh":[],"x":896.0,"y":1486.0,"anchors":["LoopReturn.runs_away","LoopReturn.runs_away_unbounded","LoopReturn.whole_factors","carried_doubles_roundTrip","runaway_of_roundTrip"],"dynamics":[]},"e2.norest":{"id":"e2.norest","row":"e2","col":6,"en":"Nowhere it could rest","zh":"怎么都不算够","says_en":"Nothing it could stay at meets what it is after: the mark is set against where it now is, or two or more are each after standing above all the rest.","says_zh":"它停在哪里都达不到它要的：那个标准是对着它现在的位置定的；或者两个以上各自都要压过其余所有的。","eg_en":"Such as a target set each year at last year's result plus a tenth.","eg_zh":"比如每年的指标都定成去年的结果再加一成。","known_en":["Epicurus, Principal Doctrines: natural desires end; empty ones run without limit"],"known_zh":["伊壁鸠鲁：自然的欲望有尽，空洞的欲望无穷"],"unlike_en":["無明 (avidyā, not-knowing), the first of the twelve links (Saṃyukta Āgama 雜阿含經, sutra 298)"],"unlike_zh":["无明：十二因缘的第一支（《杂阿含经》第298经）"],"x":1056.0,"y":1486.0,"anchors":["MoreThanNow","AboveAll","Law.more_never_rests","Law.aboveAll_never_rests","aboveAll_unique","Diagonal.revision_never_rests"],"dynamics":["seeking-boundary","locked-seeking","readings-within-what-they-read"]}},"order":["b0.pays","b0.together","b0.lost","a1.new","a1.up","a1.within","a1.over","a1.past","a2.supplied","a2.short","a2.else","a2.ended","b1.outside","b1.swing","b1.held","b2.counted","b2.felt","b2.uncounted","b2.heard","b3.list","b3.rest","b3.gone","b3.inside","b3.checkers","bs.costs","bs.pays","c1.open","c1.checked","c1.old","c1.road","c1.same","c1.nomeans","d0.ring","d0.line","d1.round","d1.gap","d1.wait","d2.handed","d2.stalled","d3.several","d3.one","d3.merged","e1.line","e1.ring","e2.rest","e2.good","e2.round","e2.swing","e2.grow","e2.norest"],"passages":[{"id":"p0","from":"a1.within","to":"a1.over","kind":"line","en":"The line is exact: the level holds where what is taken stays within what comes back, and falls where it does not. The theorems say where the line lies, not what moves a taking across it.","zh":"界线是确切的：取的不超过补的，存量守得住；超过了，就降。定理说的是界线在哪里，没有说是什么把取用推过界线。","laws":["Becoming.Flow.joint_keeps","Becoming.Flow.excess_lowers","Becoming.Optimum.kept_iff_within","Becoming.Web.lost_iff","Becoming.Web.course_kept_iff","Becoming.Web.course_lost_iff","Becoming.Stock.repeat_covered_iff"],"readers":2,"tag_en":"the line: what is taken against what comes back","tag_zh":"界线：取的比不比补的多","more":[],"mid":[656.0,165.0],"tagpos":[656.0,139.0],"far":false,"tips":null},{"id":"p1","from":"b0.together","to":"a1.over","kind":"same","en":"Each alone takes no more than what comes back, yet together they take more, so the level falls at every such step. It is the same taking more than comes back, which no single count shows.","zh":"各自单看，取的都不超过补回来的；合起来却超了，于是这样的每一步存量都在降。这就是“用得比补得快”，只是哪一本单独的账上都看不出来。","laws":["Becoming.Pair.own_not_joint","Becoming.Exceeding.own_not_joint","Becoming.Flow.excess_lowers"],"readers":2,"tag_en":"the same taking; no single count shows it","tag_zh":"同一回事：一份份看都不多","more":[],"mid":[656.0,126.0],"tagpos":[656.0,120.0],"far":false,"tips":null},{"id":"p2","from":"b0.pays","to":"b0.lost","kind":"line","en":"All taking everything is each one's best reply to the rest if, and only if, nothing one alone leaves standing returns to it more than one for one.","zh":"“都拿光”是不是各自对其余的最好应对，只看一条：不管哪一个，它单独留下的每一份，回到它自己这里的都不多于一份。","laws":["Becoming.Optimum.AtOnce.drain_perfect_iff","Becoming.Optimum.AtOnce.whole_perfect_iff","Becoming.Optimum.Holding.doubling_drawn_first"],"readers":2,"tag_en":"what it spares: does more come back to it?","tag_zh":"留下一份，回到自己这里的超不超过一份","more":[],"mid":[576.0,31.0],"tagpos":[576.0,25.0],"far":false,"tips":null},{"id":"p3","from":"b0.lost","to":"a1.over","kind":"law","en":"Where what is left returns less than one for one at every level and all can be taken, every best course takes all there is at the first step.","zh":"只要留下的不管是多少，回来的都不到那么多，而且一次拿得完，每一种最好的做法都在第一步就拿光。","laws":["Becoming.Optimum.frontier_exhausts","Becoming.Optimum.Next.frontier_exhausts","Becoming.Web.frontier_exhausts","Becoming.Optimum.AtOnce.drains"],"readers":2,"tag_en":"so each takes all it can","tag_zh":"于是各自能拿就拿","more":[],"mid":[739.5,126.0],"tagpos":[739.5,120.0],"far":false,"tips":null},{"id":"p4","from":"b0.pays","to":"a1.up","kind":"law","en":"Where leaving pays up to some level, every best course takes nothing while the stock regrows to that level.","zh":"只要在某个水平以下留着都划得来，每一种最好的做法都先不取，等存量长回到那个水平。","laws":["Becoming.Optimum.frontier_rebuilds","Becoming.Optimum.Next.frontier_rebuilds","Becoming.Web.frontier_rebuilds"],"readers":2,"tag_en":"so the best course waits while it regrows","tag_zh":"于是先不取，等它长回来","more":[],"mid":[412.5,126.0],"tagpos":[412.5,120.0],"far":false,"tips":null},{"id":"p5","from":"a1.over","to":"a1.past","kind":"law","en":"At a standing take above what comes back, the spare above the need lasts a fixed number of steps. The point of no return comes while what lives on it still has what it needs.","zh":"取用一直高于补给的时候，高出需要的那点余量只够撑固定的步数。回不了头的那一点到来的时候，靠它延续的还够用。","laws":["Becoming.Optimum.reread_deadline_iff","Becoming.RegimeMargin.root_above_need","Becoming.FourReaders.noReturn"],"readers":2,"tag_en":"the spare runs out at a fixed step","tag_zh":"余量只够撑固定的几步","more":[],"mid":[816.0,174.0],"tagpos":[816.0,139.0],"far":false,"tips":null},{"id":"p6","from":"a1.over","to":"a1.within","kind":"needs","en":"Taking within what comes back, from some step on, keeps the need for good if, and only if, the change comes while the need is still met. No theorem here says what lowers a taking.","zh":"从某一步起改成取的不超过补的，需要能不能一直供得上，只看一条：改的那一步，需要还供不供得上。这里没有定理说是什么让取用降下来。","laws":["Becoming.Optimum.reread_kept_iff","Becoming.Optimum.kept_at_need","Becoming.Flow.Balances.kept_of_restrained"],"readers":2,"tag_en":"taking less, in time","tag_zh":"及时少取","more":[],"mid":[656.0,183.0],"tagpos":[656.0,217.0],"far":false,"tips":null},{"id":"p7","from":"a1.past","to":"a2.ended","kind":"law","en":"Under a standing take, a level below the point runs down to nothing within as many steps as it stood, and stays there; from the point up it never falls below where it started.","zh":"取用照旧不变的时候，低于那一点的存量一路降到零，步数不超过它原有的量，然后停在零上；从那一点往上，存量不会降到起点以下。","laws":["Becoming.RegimeMargin.ends_iff_below","Becoming.RegimeMargin.ends_below","Becoming.RegimeMargin.stays_ended","Becoming.RegimeMargin.holds"],"readers":2,"tag_en":"below the point it runs down to nothing","tag_zh":"过了那一点，一路降到零","more":[],"mid":[1000.5,222.0],"tagpos":[1000.5,216.0],"far":false,"tips":null},{"id":"p8","from":"a1.over","to":"a2.ended","kind":"law","en":"A constant take above what comes back ends with nothing left, in at most as many steps as the level allows.","zh":"取用恒定地高于补给，结局是一点不剩；能撑的步数不超过存量。","laws":["Becoming.RuleRebuilding.«恒取逾生则尽»","Becoming.Flow.Balances.unfed_consumption_ends","Becoming.Flow.excess_bounded","Becoming.Optimum.ends_within","Becoming.Flow.joint_excess_ends"],"readers":2,"tag_en":"a steady excess ends it","tag_zh":"一直多取，终归用尽","more":[],"mid":[913.5,222.0],"tagpos":[913.5,216.0],"far":false,"tips":null},{"id":"p9","from":"a2.supplied","to":"a2.short","kind":"line","en":"A need met at one step is cut off at the next if, and only if, the need, with all that is taken, exceeds the level with all that is given.","zh":"这一步还供得上的需要，下一步会不会断供，只看一条：需要加上全部取走的，超不超过存量加上全部补进的。","laws":["Becoming.Flow.Balances.broken_iff","Becoming.Flow.Balances.kept_iff"],"readers":2,"tag_en":"the line: need and takings against level and givings","tag_zh":"界线：要的加取的，比不比存的加补的多","more":[],"mid":[656.0,261.0],"tagpos":[656.0,235.0],"far":false,"tips":null},{"id":"p10","from":"a2.short","to":"a2.ended","kind":"law","en":"Unsupplied from some step on, it is active at most as many times as its reserve; where the reserve runs down at every such step, active or not, it has stopped after that many steps.","zh":"从某一步起一直断供，它还能动的次数不超过储备；要是储备在断供的每一步都在减，动不动都减，过了这么多步它就停了。","laws":["Becoming.Web.Carries.lasts","Becoming.Web.Carries.ends_within","Becoming.Web.consumed_ends_when_fixed"],"readers":2,"tag_en":"it lasts only as long as its reserve","tag_zh":"储备撑多久，它就撑多久","more":[],"mid":[892.5,223.0],"tagpos":[892.5,217.0],"far":false,"tips":null},{"id":"p11","from":"a2.short","to":"a2.supplied","kind":"needs","en":"A supply that returns finds it still going only if it returns before the reserve is spent; where an ending is final, a later return restores nothing. A built case shows a reserve bridging the gap.","zh":"补给回来时它还在，只能是回来得比储备用完早；要是尽了就不再起，回来晚了什么都补不回。有一个造出来的例子：储备正好撑过了断供的那一段。","laws":["Becoming.Web.ends_within_on","Becoming.Web.late_return_finds_none","Becoming.Bridged.bridged","Becoming.Web.continuing_restores"],"readers":2,"tag_en":"supply returns before the reserve is spent","tag_zh":"储备用完之前，补给回来了","more":[{"kind":"built","en":"In a built pair, one missed renewal drops one below its need. Where neither gives, it never stands again; where both give, the other's spare lifts it back, its renewal resumes, and the pair yields one more each later step.","zh":"一个造出来的两方例子：一次补给落空，其中一方跌到需要以下。都不给，它再也站不起来；都给，另一方的富余把它托回去，补给恢复，此后这一对每一步都多出一份。","laws":["Becoming.PairFlow.FailedRenewal.lines_gain","Becoming.PairFlow.WhileStanding.stays_fallen"],"readers":1}],"mid":[656.0,279.0],"tagpos":[656.0,313.0],"far":false,"tips":null},{"id":"p12","from":"a2.short","to":"a2.else","kind":"needs","en":"What still goes on after a loss that never returns needs the lost thing less than it did, or not at all.","zh":"失去的再没回来，它却还在延续，那它对那样东西的需要就是变小了，或者没有了。","laws":["Becoming.Web.consumed_continues_transformed","Becoming.Crossing.loss_does_not_decide"],"readers":2,"tag_en":"it comes to need that thing less","tag_zh":"它不那么需要那样东西了","more":[],"mid":[816.0,270.0],"tagpos":[816.0,235.0],"far":false,"tips":null},{"id":"p13","from":"a1.over","to":"e2.rest","kind":"line","en":"Where nothing comes in and every exchange loses something, change stops if, and only if, the total stops falling.","zh":"没有东西进来、每次交换又都有损耗的时候，变化停不停下，只看总量是不是不再下降。","laws":["Becoming.World.InAmounts.change_stops_iff"],"readers":2,"tag_en":"nothing coming in: is the total still falling?","tag_zh":"没有东西进来时：总量还降不降","more":[],"mid":[332,822.5],"tagpos":[342,826.5],"far":true,"tips":[[701.0,215.0],[263.0,1445.0]]},{"id":"p14","from":"a1.up","to":"a1.new","kind":"needs","en":"Always something new, on a fixed finite set of stocks, needs their total to rise again and again past every bound, given by the rest or from beyond. No theorem says a rise alone brings anything new.","zh":"“总有新的”，若所需都落在固定的有限几样存量上，就要这几样的总量一再上涨、越过任何上限，而且是由其余的或从外面给进来的。没有定理说光是涨就会带来新的。","laws":["Becoming.Web.KeepsWidening.rises_late","Becoming.Web.KeepsWidening.passes_every_bound","Becoming.Web.KeepsWidening.from_rest_or_open","Becoming.Flow.whole_not_keepsWidening"],"readers":2,"tag_en":"something always new needs a rise without end","tag_zh":"要总有新的，总量得一涨再涨","more":[],"mid":[336.0,174.0],"tagpos":[336.0,217.0],"far":false,"tips":null},{"id":"p15","from":"a1.over","to":"b2.uncounted","kind":"same","en":"The same taking, where a rule is in play and how much is left makes no difference to it.","zh":"同一种“用得比补得快”，只是多了一条规则，还剩多少对它不造成差别。","laws":[],"readers":0,"tag_en":"the same taking, with no difference to a rule","tag_zh":"同一回事：对规则不造成差别","more":[],"mid":[820,338.0],"tagpos":[830,342.0],"far":true,"tips":[[729.0,215.0],[736.0,461.0]]},{"id":"p16","from":"b2.uncounted","to":"a2.ended","kind":"law","en":"Where the rule ranks an outcome above another whenever it is higher at one of the things the rule goes by and lower at none, whatever either leaves of other things, and there is room to gain, every best outcome by the rule leaves those other things at their lowest allowed level. What lives on one of them, its need met before the step, is cut off if, and only if, that level is below its need; still needing it, it stops.","zh":"规则若是这样排：一个结果只要在规则所凭的东西里有一样更高、没有一样更低，就排在另一个前面，不管两个结果各给别的东西留下多少；又还能多得，那么按规则最好的结果，都把这些别的东西压到允许的最低处。靠其中一样延续、这一步之前需要供得上的，会不会断供，只看这个最低处是不是低于它的需要；断了供，它还照旧需要，就不再延续。","laws":["Becoming.Optimum.least_of_room","Becoming.Web.optimum_broken_iff","Becoming.Web.optimum_ends_beyond"],"readers":2,"tag_en":"best by the rule: left at the lowest allowed","tag_zh":"按规则做到最好，就把它压到最低","more":[],"mid":[972,386.0],"tagpos":[982,390.0],"far":true,"tips":[[764.0,461.0],[1063.0,311.0]]},{"id":"p17","from":"b1.outside","to":"b1.swing","kind":"needs","en":"What is selected under a rule makes a difference to the rule only at a step where the rule is set again from it. Until the first such step the rule stays as it began, whatever is selected. No theorem says what brings such a step.","zh":"在一条规则之下选出的，只有在规则照它重定的那一步，才对规则造成差别。在第一次这样重定之前，不管选出了什么，规则都和开始时一样。什么会带来这样一步，定理没有说。","laws":["Becoming.Pace.rule_alike_until_reading","Becoming.Pace.rule_at_reading","Becoming.Pace.rule_unreached"],"readers":2,"tag_en":"the rule comes to be set again from what is selected under it","tag_zh":"规则开始照着在它之下选出的重定","more":[],"mid":[496.0,406.0],"tagpos":[496.0,371.0],"far":false,"tips":null},{"id":"p18","from":"b1.swing","to":"b1.held","kind":"law","en":"Where being favoured never lowers a share: if every update of the rule favours the same side, and favours it no less when that side's share is larger, then every course is locked from the step after its second update. This holds whatever share, rule and way of updating it starts with.","zh":"设受偏向从不压低份额：只要每一次重定都偏向同一方，这一方占得越多、偏向也不减，那么无论开始时是什么份额、什么规则，规则又怎样重定，到第二次重定之后的那一步，就都定住了。","laws":["Becoming.ClosedCapture.readers_uniform_locks","Becoming.RuleCapture.uniform_locks","Becoming.RuleCapture.Second.second_exact"],"readers":2,"tag_en":"every update favours the same side","tag_zh":"每次重定都偏向同一方","more":[],"mid":[656.0,397.0],"tagpos":[656.0,371.0],"far":false,"tips":null},{"id":"p19","from":"b1.held","to":"b3.inside","kind":"same","en":"The same lock, where the way the rule is updated is formed from the favoured share too.","zh":"同一个定局，只是连规则怎样重定，也由受偏向的份额形成了。","laws":["Becoming.ClosedCapture.both_reads","Becoming.ClosedCapture.join_course","Becoming.ClosedCapture.reading_absorbed"],"readers":2,"tag_en":"the same lock, with the way the rule is updated formed from the share too","tag_zh":"同一个定局：规则怎样重定也由份额形成","more":[],"mid":[903.0,487.5],"tagpos":[913.0,491.5],"far":false,"tips":null},{"id":"p20","from":"bs.costs","to":"bs.pays","kind":"line","en":"Within one step, the rule favours those shaping it if, and only if, the part of the return that comes back only to them covers the cost. What all get equally does not change which side the rule favours at that step. A return shared within a group counts by how far the shapers are gathered in the same groups.","zh":"就一步来说，规则偏不偏向改规则的一方，只看一条：只回到这一方的那部分，抵不抵得过花费；各方一样都得的，不改变规则在这一步偏向哪一方。只在一组之内分的那部分，改的一方在组里越集中，算进去的越多。","laws":["Becoming.RuleShaping.favours_iff","Becoming.RuleShaping.disfavours_iff","Becoming.RuleShaping.favours_alike","Becoming.RuleShaping.grouped_rises_iff"],"readers":2,"tag_en":"does the return to shapers alone cover the cost?","tag_zh":"只回到改规则一方的，抵不抵得过花费","more":[],"mid":[816.0,685.0],"tagpos":[816.0,659.0],"far":false,"tips":null},{"id":"p21","from":"bs.pays","to":"b3.inside","kind":"law","en":"Where each update sets the rule from the judgments of what it has selected, and those shaping it judge shaping's return no lower than the rest do, a start at which the rule so set favours the shapers is locked: their share and the rule's favour never fall.","zh":"每次重定都照规则选出的各方的判断来定规则，改规则的一方对“改了能回来多少”的估计又不低于其余的，那么从这样定出的规则偏向改规则一方的起点出发，就一直定着：这一方的份额和规则对它的偏向，都不再降。","laws":["Becoming.DrawnShaping.drawn_locks","Becoming.DrawnShaping.drawn_rises","Becoming.DrawnShaping.drawn_reads_iff"],"readers":2,"tag_en":"the rule is set from the judgments of what it has selected","tag_zh":"规则照它选出的各方的判断来定","more":[],"mid":[896.0,646.0],"tagpos":[896.0,640.0],"far":false,"tips":null},{"id":"p22","from":"b2.uncounted","to":"b3.gone","kind":"built","en":"What is used up is what those that would count the loss live on, so using it up removes them. Shown in built cases, and as a reading.","zh":"被耗掉的，正是会把损耗算进去的各方靠着延续的东西，所以把它耗掉，就清走了它们。有造出来的例子，也有一条解读。","laws":["Becoming.ReadingsSpread.Commons.cleared_spreads","Becoming.ReadingsPersist.Habitat.cleared_removes_its_readers","Becoming.PoolFromCourse.Drained.strong_undone"],"readers":2,"tag_en":"built cases: those that would count the loss lived on it","tag_zh":"造出来的例子：会把损耗算进去的正靠它延续","more":[],"mid":[743.0,550.0],"tagpos":[743.0,544.0],"far":false,"tips":null},{"id":"p23","from":"b3.gone","to":"d3.one","kind":"law","en":"Once all that is left holds one kind of view, and each new view only copies or mixes an earlier one with that of something still present, every later view is of that kind: nothing left can revise it.","zh":"剩下的都是同一类看法，新的看法又只是照着原有的和还在场的抄或者掺，那么往后的看法就都是这一类：留下的里面，已经没有什么能改它了。","laws":["Becoming.Flow.closedFrom_of_standing","Becoming.SelectionTerm.Generations.fixed_of_closedFrom"],"readers":2,"tag_en":"all that is left holds one view","tag_zh":"剩下的都是一个看法","more":[],"mid":[812,928.5],"tagpos":[822,932.5],"far":true,"tips":[[743.0,639.0],[729.0,1213.0]]},{"id":"p24","from":"b3.inside","to":"b3.checkers","kind":"reading","en":"The checks too come to follow what the rule favours. Second order: the ways a loss could come to count are filled by what the rule favours. Third: breaking them is itself what the rule favours. A reading; no theorem.","zh":"查错的途径也跟着规则偏向的一方走。第二阶：损耗本来可以靠它们算进去的那些途径，也由规则偏向的一方占着。第三阶：弄坏这些途径，本身就是规则所偏向的事。这是解读，没有定理。","laws":[],"readers":0,"tag_en":"the checks too come to follow what the rule favours","tag_zh":"查错的途径也跟着规则偏向的一方走","more":[],"mid":[976.0,598.0],"tagpos":[976.0,563.0],"far":false,"tips":null},{"id":"p25","from":"b3.checkers","to":"d2.handed","kind":"reading","en":"The pattern goes on remaking what selects it while what carries it is replaced: the meta-attractor in the wide sense. Open; no theorem says this pattern is handed on.","zh":"承载它的换了一茬又一茬，这个格局照旧重建出选中它的条件：这是广义的元吸引子。未定；还没有定理说这个格局会这样传下去。","laws":[],"readers":0,"tag_en":"the pattern keeps remaking what selects it","tag_zh":"格局不断重建选中它的条件","more":[],"mid":[492,878.0],"tagpos":[502,882.0],"far":true,"tips":[[1056.0,639.0],[402.0,1117.0]]},{"id":"p26","from":"b2.uncounted","to":"b2.felt","kind":"line","en":"For a rule set only from which of the pool keep going: the loss can get back to it early enough if, and only if, the first step at which it makes a difference to whether one of them keeps going comes before the point of no return.","zh":"对只照定规则所依的各方里哪些还在来定的规则来说：损耗能不能及时传回这条规则，只看一条：损耗头一次对其中一方还在不在造成差别的那一步，是不是早于回不了头的那一点。","laws":["Becoming.Web.readableInTime_iff"],"readers":2,"tag_en":"can it get back to the pool early enough?","tag_zh":"能不能及时传回定规则所依的各方","more":[],"mid":[656.0,502.0],"tagpos":[656.0,545.0],"far":false,"tips":null},{"id":"p27","from":"b2.uncounted","to":"a1.past","kind":"law","en":"If the loss makes no difference to whether any of the pool keeps going until what is being lost can no longer be kept, then it can get back early enough to no rule set only from which of them keep going. The same holds if the only ones in the pool are the ones being lost.","zh":"如果损耗要等到正在失去的东西留不住了，才对定规则所依的各方里任何一方还在不在造成差别，那么只照它们里面哪些还在来定的规则，没有一条是损耗能及时传回的。这些方如果只有正在失去的那些，也一样。","laws":["Becoming.Web.too_late_of_alike","Becoming.Web.too_late_of_own","Becoming.Web.readableInTime_iff"],"readers":2,"tag_en":"it makes a difference only when it is too late","tag_zh":"等造成差别，已经晚了","more":[],"mid":[812,338.0],"tagpos":[822,342.0],"far":true,"tips":[[750.0,461.0],[903.0,215.0]]},{"id":"p28","from":"b2.felt","to":"b2.counted","kind":"law","en":"Suppose the rest, once they count the loss, go on counting it at every later update (in the theorem the loss only grows and none of the rest is removed), and judge no more for the favoured side than that side does. Where judgments taken together then go against what the rule favoured, ties included, the rule turns for good if, and only if, they still go against it at the next update.","zh":"设其余的一旦把损耗算进去，此后每次重定都照旧算（在定理里，损耗只涨不落，其余的也没有哪一方被清走）；它们的判断又不比受偏向的一方自己更偏向这一方。这时，合起来的判断若不利于规则原先偏向的一方（打平也算不利），规则是不是从此转向、不再转回，只看下一次重定时合起来的判断是不是仍然不利于它。","laws":["Becoming.ReadInTime.turned_iff","Becoming.ClosedCapture.Thinned.turned_iff","Becoming.ClosedCapture.Thinned.kept_iff"],"readers":2,"tag_en":"the rest count the loss, and outweigh","tag_zh":"其余的把损耗算进去，而且压得过","more":[],"mid":[496.0,502.0],"tagpos":[496.0,545.0],"far":false,"tips":null},{"id":"p29","from":"b2.felt","to":"b2.heard","kind":"law","en":"Where each step adds to the loss and the rest judge no more for the favoured side than that side does: the lock stays if, and only if, by the time the rest begin to count the loss, judgments taken together already favour what the rule favours.","zh":"要是每一步都往损耗上再添一份，其余的判断又不比受偏向的一方自己更偏向这一方：规则是不是照旧定着，只看一条：等其余的开始算这笔损耗的时候，合起来的判断是不是已经偏向规则所偏向的一方。","laws":["Becoming.ReadInTime.kept_early_iff","Becoming.ReadInTime.kept_iff","Becoming.ReadInTime.kept_once_favoured","Becoming.ReadInTime.deadline","Becoming.ClosedCapture.Thinned.kept_iff"],"readers":2,"tag_en":"the rest count the loss too late","tag_zh":"其余的算得太晚","more":[],"mid":[816.0,455.0],"tagpos":[816.0,449.0],"far":false,"tips":null},{"id":"p30","from":"b3.inside","to":"b2.counted","kind":"needs","en":"Suppose the rule is set in a way that never favours once the loss has passed a set amount, and the loss keeps growing (a premise too). Then the lock ends: once the loss has passed that amount the rule, after every update, no longer favours the side it favoured, however large that side's share.","zh":"一种定规则的办法，损耗过了定量就不再偏向；损耗又每一步都在涨（这也是前提），这个定局就会松开：一旦过了那个量，此后每次重定完，规则都不再偏向原先的一方，不管那一方的份额已经多大。","laws":["Becoming.ClosedCapture.turned_by_loss","Becoming.ClosedCapture.loss_ends_line"],"readers":2,"tag_en":"a way of setting the rule that stops favouring past a set loss","tag_zh":"损耗过了定量就不再偏向的定规则办法","more":[{"kind":"built","en":"Built case: the loss changes no judgment, but it falls on what the rule favours. That side's share shrinks for three steps while the lock still stands; then the lock gives way and the rule turns to the other side.","zh":"造出来的一例：损耗不改变任何一方的判断，却落在规则偏向的一方身上。这一方的份额连降三步，定局还在；随后定局松开，规则转向另一边。","laws":["Becoming.PoolFromCourse.Borne.shapers_left","Becoming.PoolFromCourse.Borne.shapers_turned","Becoming.PoolFromCourse.borne_falls"],"readers":1}],"mid":[659.5,550.0],"tagpos":[659.5,544.0],"far":false,"tips":null},{"id":"p31","from":"b1.held","to":"b2.counted","kind":"needs","en":"Suppose the rest, once they count the loss, go on counting it at every later update (in the theorem the loss only grows and none of the rest is removed), and judge no more in the favoured side's favour than that side does. Once they start counting and the rule is updated twice running, the rule turns and is locked in the other way for good if, and only if, judgments taken together still go against what it favoured, ties included, at the second update. No theorem says what makes them start.","zh":"设其余的一旦把损耗算进去，此后每次重定都照旧算（在定理里，损耗只涨不落，其余的也没有哪一方被清走）；它们的判断又不比受偏向的一方自己更偏向这一方。其余的开始把损耗算进去，规则接连重定两次：规则是不是就此转过去、定在另一边，只看第二次重定时，合起来的判断是不是仍然不利于它原先偏向的一方（打平也算不利）。是什么让它们开始算，没有定理说。","laws":["Becoming.ReadInTime.turned_early_iff"],"readers":2,"tag_en":"the rest start counting the loss","tag_zh":"其余的开始算这笔损耗","more":[],"mid":[569.0,454.0],"tagpos":[569.0,448.0],"far":false,"tips":null},{"id":"p32","from":"b3.gone","to":"b3.list","kind":"needs","en":"Taken over a fixed list of all that began, a measure asking each to go on fails wherever one is removed; taken only among what is left, it passes once the course settles, whatever was removed.","zh":"按一开始就定下的全部名单来量，“各自都要延续”这个标准，凡是清走了其中一个的过程都通不过；只在剩下的里面量，过程一旦落定，清走多少都照样通过。","laws":["Becoming.not_allPersist_of_removes","Becoming.survivorsPersist_of_settled","Becoming.AllPersist.survivors"],"readers":2,"tag_en":"measure over all that began","tag_zh":"按最初的全部名单来量","more":[],"mid":[492.5,645.0],"tagpos":[492.5,659.0],"far":false,"tips":null},{"id":"p33","from":"a1.over","to":"a1.up","kind":"built","en":"In a built case, one step of taking more than is given empties the stock and stops what lives on it; then a giver that needs nothing gives, the level is back, and it goes on again.","zh":"一个造出来的例子：有一步取的比给的多，存量见底，靠它延续的停了；随后一个什么都不需要的给了一份，存量回来，那一个又接着延续。","laws":["Becoming.Restored.returns"],"readers":1,"tag_en":"built case: a giver that needs nothing gives","tag_zh":"造出来的一例：什么都不需要的给了一份","more":[],"mid":[576.0,221.0],"tagpos":[576.0,235.0],"far":false,"tips":null},{"id":"p34","from":"a1.over","to":"a2.else","kind":"law","en":"Where more is drawn than comes back at every step, and the one drawing can switch to another support, it goes on at every step by switching, still drawing down; the other that lives on the same stock ends.","zh":"每一步取的都比补的多，而取用的一方能改靠别的：它靠着改换，每一步都在延续，照旧在耗；同靠这份存量的另一方尽了。","laws":["Becoming.Substitution.persists_consuming"],"readers":1,"tag_en":"it switches to another support","tag_zh":"它改靠别的","more":[],"mid":[823.0,222.0],"tagpos":[823.0,216.0],"far":false,"tips":null},{"id":"p35","from":"a1.past","to":"a2.else","kind":"needs","en":"Where going on requires every need met at every step: after a loss that does not return, nothing goes on still depending on what was lost at as great a need; it needs it less, or not at all.","zh":"要是每一步每样需要都得满足才能延续：一样东西失去了又不再回来，之后还在延续的，对它的需要不会还像原先那么大；要么需要变小了，要么不再靠它。","laws":["Becoming.Web.consumed_continues_transformed"],"readers":1,"tag_en":"what keeps going no longer needs it as much","tag_zh":"还在延续的，已不那么靠它","more":[],"mid":[910.0,222.0],"tagpos":[910.0,216.0],"far":false,"tips":null},{"id":"p36","from":"a1.within","to":"a2.short","kind":"needs","en":"Where chance alone moves a level, rises and falls balancing on average, it reaches its need within a span in at most a share of courses: the span times the spread of a step, over the margin squared.","zh":"只有偶然在推一个存量，涨跌平均相抵：在一段步数之内跌到需要线的过程，所占份额至多是步数乘以每步的波动、再除以余量的平方。","laws":["Becoming.ConditionalWeights.fallsWithin_bound","Becoming.ConditionalWeights.fallsWithin_share"],"readers":1,"tag_en":"by chance: the wider the margin, the rarer","tag_zh":"单凭偶然：余量越宽越少见","more":[],"mid":[649.0,222.0],"tagpos":[649.0,216.0],"far":false,"tips":null},{"id":"p37","from":"b1.held","to":"d3.one","kind":"law","en":"Where members are replaced one at a time by weighted chance, no lock is sure: from any mix, some courses lose everything that shapes the rule and some end with nothing else, each with weight bounded below.","zh":"成员按权重随机地一个个被替换时，没有哪一种定局是稳的：从任何一种混合出发，都有一部分过程把改规则的全丢掉，也有一部分最后只剩改规则的，两者的权重都有下限。","laws":["Becoming.DrawnReplacement.lost_ge","Becoming.DrawnReplacement.fixed_ge"],"readers":1,"tag_en":"members replaced by chance, one at a time","tag_zh":"成员一个个随机替换","more":[],"mid":[816,832.5],"tagpos":[826,836.5],"far":true,"tips":[[750.0,447.0],[743.0,1213.0]]},{"id":"p38","from":"b2.uncounted","to":"b2.counted","kind":"needs","en":"Under a rule that counts the one thing left out after its mark is met, the best outcomes keep the need if, and only if, some way of meeting the mark keeps it; under one that rewards keeping, they keep it where the reward exceeds what keeping forgoes.","zh":"规则若在自己的标准达到之后，把原先没算进去的那样东西也算上：最好的结果保不保得住对它的需要，只看有没有一种办法既达标又保得住。规则若是奖励保住这份需要：只要奖励超过为保住它而放弃的，最好的结果就保得住。","laws":["Becoming.Optimum.counted_after_keeps_iff","Becoming.Optimum.frontier_keeps_above","Becoming.Optimum.frontier_keeps_stepwise","Becoming.Optimum.Topped.weighted_keeps","Becoming.Optimum.Drain.satisficingThen_keeps"],"readers":1,"tag_en":"a rule that counts it","tag_zh":"换一条把它算进去的规则","more":[],"mid":[565.5,549.0],"tagpos":[565.5,563.0],"far":false,"tips":null},{"id":"p39","from":"b3.gone","to":"b2.felt","kind":"reading","en":"The loss of what would read the loss can come back on what sets the rule: in one built case that one ends too, though its measure among what is left still shows nothing. That this turns the rule is a reading.","zh":"读得到损耗的没了，这个损失可以落回定规则的各方身上：在一个造出来的例子里，定规则的那一方也跟着尽了，可它在剩下的里面衡量，仍然看不出少了什么。说这样规则就会转，只是一条解读。","laws":["Becoming.ReadingsPersist.Habitat.clearedBack_removes_both","Becoming.ReadingsPersist.Habitat.clearedBack_survivors_pass"],"readers":1,"tag_en":"the loss can fall on what sets the rule","tag_zh":"损失可能落回定规则的各方","more":[],"mid":[656.0,550.0],"tagpos":[656.0,544.0],"far":false,"tips":null},{"id":"p40","from":"d1.wait","to":"d1.round","kind":"needs","en":"From total withholding, giving returns only if something gives without waiting. Where some do, and the rest give exactly when all they wait on gave at the step before, all give from a given step on, whatever the start, if, and only if, every chain of that many waits comes, somewhere after its start, to one that gives without waiting.","zh":"全都不给的时候，只有出现不等就给的，给才回得来。有了这样的，其余的还是所等的上一步全给了就给、缺一个就不给：那么不论从哪里起步，要从第几步起全都在给，就看几个“等”连成的串：这样的串，每一串过了串头都碰得上一个不等就给的，就做得到；有一串碰不上，就有一种起步做不到。","laws":["Becoming.Tolerance.withheld_kept","Becoming.Tolerance.restores_iff","Becoming.Tolerance.restores_from","Becoming.Tolerance.waitsAll_never_restores","Becoming.Withholding.Ring.givesFirst_restores","SeededContinuation.stored_seed_starts_and_maintains"],"readers":1,"tag_en":"something gives without waiting","tag_zh":"有一个不等就给","more":[],"mid":[656.0,1109.0],"tagpos":[656.0,1123.0],"far":false,"tips":null},{"id":"p41","from":"d2.handed","to":"a2.ended","kind":"law","en":"Where a pattern gains carriers only by being handed on and handing on stops, it is gone within one carrier's span. In a rule taught by its holders, if holders leave before they can teach, or the quota is set to nothing and not raised again, no holder is left after one tenure.","zh":"一个格局要是只靠往下传才有新的来承载，一旦不再往下传，在一茬的时间之内就没了。在一条由守着它的成员来教的规则里：要是守着它的还没到能教的年头就退了，或者名额改成零、再没改回来，过一任就一个守着它的都不剩。","laws":["Becoming.Web.ByPassing.ends_within","Becoming.RuleRebuilding.«不及任则持尽»","Becoming.RuleRebuilding.«改额为零则持尽»"],"readers":2,"tag_en":"handing on stops","tag_zh":"不再往下传","more":[{"kind":"line","en":"A rule taught by its holders, from a steady state, newcomers always on offer, unrevised, is held for good if, and only if, holders stay longer than teaching takes, some are let in, and all members together take within what comes back.","zh":"由守着它的成员来教的规则，从稳态出发，一直有新来的可收，规则不改：它是不是每一步都有守着它的，只看三样齐不齐：守着它的时间比教会所需的长，至少收进一个，全体成员合起来取用的不超过补回来的。","laws":["Becoming.RuleRebuilding.«稳者恒持当且仅当在带»"],"readers":2},{"kind":"needs","en":"A line ends only by a step that leaves the part of its sameness that carries itself on; a step that keeps that part is never the last. This holds whatever sameness
