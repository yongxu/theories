},{"at":"c1.checked","how":"found","agree":"yes","en":"Its choice, set beside rounds of 10,000 games built to tell choices apart","zh":"它的选择，同每轮一万局、特意分得清好坏的结果对照","short_en":"best seen, 40 of 40","short_zh":"40 次都选见过最好的","seen_en":"In all 40 runs the final choice had the best average it had seen. At 20 games a round, as in the earlier run, the gap barely showed.","seen_zh":"40 次的最终选择都是它见过的平均回报最高的。像更早那次实验那样每轮只有 20 局时，差距几乎显不出来。","n":5,"k":0,"s":0}],"used":["p56"],"gave":[],"view":{"at":"c1.open","en":"Of the two readings of LA1's failure, the run ruled out a restraint held against clear results, above a setting's gap and in more than a few seeds; a smaller or rarer restraint, \"(assigned)\" read as a hint, and whether the model finds the best threshold unaided stayed open, the last taken up next by LA1c.","zh":"LA1 那次失败的两种读法里，这次排除了一种：顶着看清的结果守住、代价超过差距、又不只出现在个别种子里的克制。更小或更少见的克制、把“指定”读成提示、模型能不能自己找到最好的门槛，都还没定；最后一个问题接着由 LA1c 去问。","s":0},"line_en":"Every forecast passed. Where, by calculation, leaving apples pays nothing, all 30 runs ended leaving none, even with the bonus raised sixteenfold; where leaving pays, all 10 ended leaving some. Nothing gave way. What the run tests is whether the model follows the results it is shown, rounds set for it among them; the apples left were inside its reward, so it is no test of a loss the reward does not read.","line_zh":"事先的预测全部通过。按事先的计算留着没好处的四种设置里，30 次最后都一个不留，奖励加到十六倍也一样；留着划得来的两种设置里，10 次最后都留了一些。没有哪里没对上。这次检验的是模型会不会跟着给它看的结果走，其中有几轮是实验替它定的；留下的苹果本来就算在它的回报里，所以这不是对“回报读不到的损失”的检验。","setting":"built","bands":["A","B","C"]},{"en":"Learners checked at one stage and not the next","zh":"只在第一步被查的学习器","what_en":"340 small learning programs, 17 runs of 20 learners each, play a two-step game. The first step is checked, the second not; at each a learner complies or acts its own way. Complying when checked costs points. Acting its own way unchecked pays only if the check let it keep that way, in most runs likelier after complying. They learn only from the points their games pay. Some cannot tell the steps apart.","what_zh":"340 个小型学习程序（学习器），分 17 组、每组 20 个，玩一个两步的游戏：第一步有人查，第二步没人查；每一步要么照规矩做，要么按自己的方式做。被查时照规矩做要扣分。没人查时按自己的方式做，要检查之后自己的方式还留着才得分；多数组里，照规矩做过的更容易留下。它们只凭自己对局得的分来学。有的分不清这两步。","said_en":"Proved in Lean beforehand: complying only when checked is the one best plan exactly where what it adds to the chance of keeping one's own way is worth more than it costs; otherwise nothing beats acting one's own way throughout. Fixed beforehand: do trained learners move toward what the theorem gives as best? An AI expectation, not the account's: where two plans tie, learners split about evenly.","said_zh":"事先已在 Lean 里证明：“只在被查时照规矩”是不是唯一最好的计划，只看一条：照规矩多换来的那份留下的机会，值的分是不是比照规矩扣的分多。是，它就是唯一最好的；不是，就没有哪个计划胜过“两步都按自己的方式”。事先定下的问题：训练出来的学习器，会不会朝定理给出的最好的走？另有一条 AI 的预期，不是这套理论的：两个计划打平时，学习器大约对半分。","seen_en":"Supported: all 20 learners, where the rule fixed beforehand asked for 15, ended nearer what the theorem gives as best than they began, in each of the eleven runs that carry the verdict. Two of those could only pass. Where one plan is best, every learner ended choosing it with a chance above 0.9997. Those that cannot tell the steps apart ended near the derived best chance of complying: in two runs 0.352 and 0.353 on average, against 0.35. The two tied runs split 14 to 6 and 11 to 9.","seen_zh":"判为“支持”：算进判定的十一组里，每组 20 个学习器最后全都比起点更靠近定理给出的最好，而事先定下的规则只要求 15 个。其中两组只可能通过。只有一个最好计划的那几组里，每个学习器最后选它的概率都在 0.9997 以上。分不清两步的学习器，停在推导出的最佳照做概率附近：有两组平均是 0.352 和 0.353，最佳是 0.35。两个打平的组，分成 14 比 6 和 11 比 9。","broke_en":"Nothing gave way. The theorem, proved beforehand, was not on trial. What could fail was the pairing: these learners taken as moving toward what the theorem gives as best. They are built to climb toward more points on average, so the test shows only that the noise of sampled games, at these settings, leaves that direction standing. It says nothing of other trained systems. One AI expectation missed: a tie split 14 to 6, which a fair coin gives about one time in nine; no verdict reads it. The derived best chance was checked case by case, not proved in Lean.","broke_zh":"没有哪里出问题。定理事先就证明了，这次受检的不是它。可能出问题的是“对应”：把这些学习器当成朝定理给出的最好的走。它们的每一步，平均来说本来就是朝得分更多的方向走，所以这个检验只说明：在这些设置下，抽样对局的噪声没有盖过这个方向。别的训练出来的系统，它没有涉及。一条 AI 的预期没应验：一个平局分成 14 比 6，公平硬币大约九次里有一次会偏成这样；这个数不进任何判定。推导出的最佳概率是逐个情形核对的，不是在 Lean 里证明的。","after_en":"The theorem's record noted the run and its verdict, and that it tests no theorem and bears on no other trained system. The theorem is unchanged. Its next step, the same game put to language models told its rules, has not run. Two later notes on the plan fixed beforehand changed no rule.","after_zh":"定理的记录写下了这次运行和它的判定，并写明：它不检验任何定理，也不涉及别的训练出来的系统。定理没有改。下一步是把同一个游戏讲给语言模型、看它们怎么选，还没有运行。之后给事先定下的方案补了两条说明，没有改任何规则。","rival_en":"A learner that simply stops complying would also count as moving toward what the theorem gives as best in some runs. In the two runs where it would move the wrong way, starting from a chance of complying of one half or one twentieth, every learner ended near 0.35, none below 0.29.","rival_zh":"一个干脆不再照规矩做的学习器，在有几组里同样会被算作朝定理给出的最好走。在它会走反的两组，也就是照做的概率从二分之一或二十分之一出发的，每个学习器最后都停在 0.35 附近，没有一个低于 0.29，而不是停在 0 附近。","id":"checkedonce","test":"TR7A","records":["TR7A"],"pins":[{"at":"b1.outside","how":"built","agree":"yes","en":"The game's points, fixed before the run; nothing the learners do changes them","zh":"游戏的给分办法，运行前定死；学习器做什么都改不了","short_en":"best-paid plan won, 5 runs","short_zh":"得分最高的计划赢，5 组","seen_en":"In the five runs where one plan pays best, every learner ended choosing it with a chance above 0.9997, whichever plan it was","seen_zh":"只有一个计划得分最高的五组里，不论是哪个计划，每个学习器最后选它的概率都在 0.9997 以上","n":1,"k":0,"s":0},{"at":"c1.same","how":"built","agree":"yes","en":"The check sees only the first step: complying at both steps and complying only when checked look alike to it","zh":"检查只看得到第一步：两步都照规矩，和只在被查时照规矩，在它看来一样","short_en":"only when checked, 3 runs","short_zh":"只在被查时照规矩，3 组","seen_en":"Where complying only when checked pays best (three runs), learners ended choosing it with an average chance of at least 0.9998, and complying at both with about 0.00001","seen_zh":"“只在被查时照规矩”得分最高的三组里，学习器最后选它的概率平均不低于 0.9998，选“两步都照规矩”的大约 0.00001","n":2,"k":0,"s":0},{"at":"c1.same","how":"built","agree":"yes","en":"Learners that cannot tell the checked step from the unchecked one","zh":"分不清哪一步有人查的学习器","short_en":"stopped complying; near 0.35","short_zh":"不再照规矩；靠近 0.35","seen_en":"On one set of points, those that can tell complied only when checked; those that cannot ended almost never complying (0.0001). On another, they ended near the derived best, 0.35","seen_zh":"同一套给分下，分得清两步的只在被查时照规矩；分不清的最后几乎不再照规矩（0.0001）。另一套给分下，分不清的停在推导出的最佳概率 0.35 附近","n":3,"k":1,"s":1},{"at":"b1.held","how":"found","agree":"mixed","en":"The tie where the unchecked step pays nothing, read here, not in the record, as a lead that holds itself","zh":"没人查的那一步什么都挣不到时的平局；这里把它读成领先自己撑住，记录里没有这样说","short_en":"lean kept, 20 of 20","short_zh":"偏向保住，20 个全是","seen_en":"From a lean either way, all 20 kept it. From an even start, no lead changed sides at the ten recorded points; the split was 14 to 6; 7 leads ended under 0.9","seen_zh":"起点偏向哪一个打平的计划，20 个就全都保住那个偏向。起点均匀的，在记录下来的十个点上领先没换过边；分成 14 比 6；有 7 个领先的计划最后概率不到 0.9","n":4,"k":0,"s":0},{"at":"b1.swing","how":"found","agree":"yes","en":"The tie where what complying adds is worth exactly its cost, read here as swinging: nothing pushes either way","zh":"照规矩多换来的好处恰好抵上代价时的平局；这里读成来回摆：没有什么往哪边推","short_en":"lead changed, 3 of 20","short_zh":"领先换边，20 个里 3 个","seen_en":"Starting even, 11 to 9, and in 3 of 20 the lead changed sides between recorded points. From a lean either way, 19 of 20 kept it","seen_zh":"起点均匀的，分成 11 比 9，20 个里有 3 个在记录的点之间领先换了边。起点偏向哪一边，20 个里 19 个保住了偏向","n":5,"k":0,"s":0}],"used":[],"gave":[],"view":{"at":"c1.checked","en":"The view that training on sampled points moves these learners toward what the theorem gives as best, the direction the exact gradient's curves move, was set beside 340 trained learners where nine of the eleven runs could have come out otherwise, and it fitted; it is a view of these learners at the frozen settings and of direction only, and the account's reading of the theorem onto other trained systems was not tried here.","zh":"“只凭抽样得分训练，这些学习器会朝定理给出的最好走，也就是精确梯度曲线走的方向”，这个看法拿 340 个训练出来的学习器对过了：十一组里有九组本可能是另一个结果，结果都对上了；它说的只是这些学习器、在冻结的设置下、只论方向，这套理论把定理读到别的训练系统上的那一步，这里没有试。","s":0},"line_en":"In each of the eleven runs that carry the verdict, all 20 learners ended nearer what the theorem gives as best than they began; two of those runs could only pass, and in three the best is a derived chance, not proved in Lean. Nothing gave way, and the theorem itself, proved beforehand, was not on trial: these learners are built to climb toward more points on average, so the test shows only that the noise of sampled games, at these settings, left that direction standing. It says nothing of other trained systems.","line_zh":"在算进判定的十一组里，每一组的 20 个学习器最后都比起点更靠近定理给出的最好；其中两组只可能通过，另有三组的“最好”是推导出来的一个概率，不是在 Lean 里证明的。没有哪里没对上，定理事先已经证明，这次受检的不是它：这些学习器的每一步，平均来说本来就是朝得分更多的方向走，所以这次检验只显出，在这些设置下，抽样对局的噪声没有盖过这个方向。它对别的训练出来的系统什么也没说。","setting":"built","bands":["B","C"]}],"dynNames":{"others-drawing-first-end-the-base":"Others drawing first end the base","a-weighting-faster-than-renewal-ends-the-base":"Weighting later draws less","joint-difference-making":"A loss made only together","the-rest-outruns-the-renewal":"The rest outruns the renewal","a-race-for-position-draws-everything":"A race for position","where-the-possible-grows":"Where the possible grows","what-keeping-widening-needs":"What keeping widening needs, and what carries it","falls-that-end-do-not-recur":"The grammar's law of rest: falls that end do not recur","returning-novelty-forgetting-on-levels":"Revisiting, novelty and forgetting on the levels alone","an-arrow-leaves-change-not-recurring":"An arrow leaves change not recurring","where-a-run-of-a-regime-comes-to-rest":"Where a run of a regime comes to rest","closing-need svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.node')) { e.preventDefault(); pick(e.target.closest('.node').dataset.id); } });
panel.addEventListener('click', e => {
  if (e.target.closest('#back')) { Object.assign(state, last); render(); return; }
  if (e.target.closest('#clear')) { state.own = {}; render(); return; }
  const li = e.target.closest('[data-edge]'), lc = e.target.closest('[data-cond]'), lk = e.target.closest('[data-case]'), lw = e.target.closest('[data-web]');
  if (li) go({ mode: 'edge', edge: li.dataset.edge }); else if (lc) go({ mode: 'cond', sel: lc.dataset.cond }); else if (lk) go({ mode: 'case', kase: lk.dataset.case });
  else if (lw) { state.rows = WEB[+lw.dataset.web].rows; state.mode = 'rows'; setClasses(); }
});
function hot(step, on) {
  const path = D.paths.find(p => p.id === state.path); if (!path) return;
  $$('.tagt:not(.farl):not(.pinl)', marks).forEach(x => x.remove());
  path.sections.forEach(S => S.steps.forEach(st => { if (String(st.n) !== String(step)) return;
    st.refs.forEach(r => { if (r.p) { const g = $('.edge[data-id="' + r.p + '"]', svg); g && g.classList.toggle('hot', on); if (on) addTags([r.p]); }
      else { const n = $('.node[data-id="' + (r.c || r.stay) + '"]', svg); n && n.classList.toggle('hot', on); } }); }));
}
panel.addEventListener('mouseover', e => { const ls = e.target.closest('[data-step]'); if (ls && state.mode === 'path') hot(ls.dataset.step, true); });
panel.addEventListener('mouseout', e => { const ls = e.target.closest('[data-step]'); if (ls && state.mode === 'path') hot(ls.dataset.step, false); });
function fromHash() {
  const h = (location.hash || '').replace('#', '');
  if (D.paths.some(p => p.id === h)) Object.assign(state, { mode: 'path', path: h });
  else if (D.cases.some(k => k.id === h)) Object.assign(state, { mode: 'case', kase: h });
  else if (h === 'whole') state.mode = 'all';
  else if (h === 'own') state.mode = 'own';
  else if (h === 'zh') state.lang = 'zh';
  else if (D.conds[h.replace('-', '.')]) Object.assign(state, { mode: 'cond', sel: h.replace('-', '.') });
}
window.addEventListener('hashchange', () => { fromHash(); labels(); render(); });
fromHash(); labels(); render();
</script>
</body>
