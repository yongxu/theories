<text x="286" y="431" font-size="14" text-anchor="start" fill="#57534e">below the grammar</text>
<text x="286" y="449" font-size="14" text-anchor="start" fill="#1c1917">For example, RelativePosition.rise_needs_fall: No change raises every part's</text>
<text x="286" y="467" font-size="14" text-anchor="start" fill="#1c1917">position, and a part's rise needs another part's fall</text>
