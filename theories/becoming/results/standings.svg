<text x="24" y="876" font-size="12.5" text-anchor="start" fill="#57534e">A named distance says why a declaration is not read as a case of grammar laws; the edge record does not show that a</text>
<text x="24" y="892" font-size="12.5" text-anchor="start" fill="#57534e">distance is a gap or a failure. The ethics’ two premises, the continuation condition for scope and C for order, are</text>
<text x="24" y="908" font-size="12.5" text-anchor="start" fill="#57534e">not among these: neither stands on the edge.</text>
<text x="24" y="928" font-size="12.5" text-anchor="start" fill="#57534e">Each declaration's standing is in the edge record, one-root-to-its-edge: 42 have a basis in words, in its data, and</text>
<text x="24" y="944" font-size="12.5" text-anchor="start" fill="#57534e">the other 75 the label a rule gives; the page of each record whose laws name a declaration prints its standing, with</text>
<text x="24" y="960" font-size="12.5" text-anchor="start" fill="#57534e">its basis or the rule's reason. 08 §7 gives the classes on amounts and laws of their models no further words. The</text>
<text x="24" y="976" font-size="12.5" text-anchor="start" fill="#57534e">terms edge of one root, derived and named distance are in GLOSSARY.md.</text>
<text x="24" y="996" font-size="12.5" text-anchor="start" fill="#57534e">Generated by tools/research/spine.py from shared-laws.json and spine.json.</text>
