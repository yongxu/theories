<text x="286" y="723" font-size="14" text-anchor="start" fill="#57534e">as chapter 7 intends</text>
<text x="24" y="750" font-size="12.5" text-anchor="start" fill="#57534e">A named distance says why a declaration is not read as a case of grammar laws; the edge record does not show that a</text>
<text x="24" y="766" font-size="12.5" text-anchor="start" fill="#57534e">distance is a gap or a failure. The ethics’ two premises, the continuation condition for scope and C for order, are</text>
<text x="24" y="782" font-size="12.5" text-anchor="start" fill="#57534e">not among these: neither stands on the edge.</text>
<text x="24" y="802" font-size="12.5" text-anchor="start" fill="#57534e">Generated by tools/research/spine.py from shared-laws.json and spine.json; each declaration and its reason: the edge</text>
<text x="24" y="818" font-size="12.5" text-anchor="start" fill="#57534e">record, one-root-to-its-edge.</text>
