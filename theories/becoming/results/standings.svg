<text x="286" y="307" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">1 under a stated hypothesis</text>
<text x="286" y="325" font-size="14" text-anchor="start" fill="#57534e">the root form RootForms.outside_leaves_no_offspring at one step</text>
<text x="286" y="343" font-size="14" text-anchor="start" fill="#1c1917">It is GroupEnding.Flow.all_end: Where every member of a generation is not active,</text>
<text x="286" y="361" font-size="14" text-anchor="start" fill="#1c1917">as where every group depends on one condition that ran into joint excess, the next</text>
<text x="286" y="379" font-size="14" text-anchor="start" fill="#1c1917">generation is empty</text>
