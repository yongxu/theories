<text x="24" y="100" font-size="14" text-anchor="start" fill="#57534e">of one root, how far the one root reaches (08 §7). 11 are read as cases of grammar laws and 1 as a root</text>
<text x="24" y="118" font-size="14" text-anchor="start" fill="#57534e">form under a stated hypothesis; the rest are counting, below the grammar, or stand at a named distance,</text>
<text x="24" y="136" font-size="14" text-anchor="start" fill="#57534e">each with its reason.</text>
