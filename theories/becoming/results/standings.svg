<text x="24" y="840" font-size="12.5" text-anchor="start" fill="#57534e">A named distance says why a declaration is not read as a case of grammar laws; the edge record does not show that a</text>
<text x="24" y="856" font-size="12.5" text-anchor="start" fill="#57534e">distance is a gap or a failure. The ethics’ two premises, the continuation condition for scope and C for order, are</text>
<text x="24" y="872" font-size="12.5" text-anchor="start" fill="#57534e">not among these: neither stands on the edge.</text>
<text x="24" y="892" font-size="12.5" text-anchor="start" fill="#57534e">The reasons not glossed here are in the edge record, one-root-to-its-edge, beside each declaration; the terms edge of</text>
<text x="24" y="908" font-size="12.5" text-anchor="start" fill="#57534e">one root, derived and named distance are in GLOSSARY.md.</text>
<text x="24" y="928" font-size="12.5" text-anchor="start" fill="#57534e">Generated by tools/research/spine.py from shared-laws.json and spine.json.</text>
