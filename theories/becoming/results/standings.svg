<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" role="img" aria-labelledby="standings-title standings-desc" font-family="Helvetica, Arial, sans-serif">
<title id="standings-title">The 117 central declarations and the grammar’s laws</title>
<desc id="standings-desc">Each square is one central declaration, a Lean statement that a row of the coverage file names as central, placed by its standing against the edge of one root (08 §7). 12 are read as cases of laws stated on the grammar; the rest are counting, below the grammar, or stand at a named distance, each with its reason.</desc>
<rect x="0.5" y="0.5" width="899" height="851" rx="10" fill="#fcfcfb" stroke="#d6d3d1"/>
<text x="24" y="40" font-size="22" font-weight="bold" text-anchor="start" fill="#1c1917">The 117 central declarations and the grammar’s laws</text>
<text x="24" y="64" font-size="14" text-anchor="start" fill="#57534e">Each square is one central declaration, a Lean statement that a row of the coverage file names as</text>
<text x="24" y="82" font-size="14" text-anchor="start" fill="#57534e">central, placed by its standing against the edge of one root (08 §7). 12 are read as cases of laws</text>
<text x="24" y="100" font-size="14" text-anchor="start" fill="#57534e">stated on the grammar; the rest are counting, below the grammar, or stand at a named distance, each with</text>
<text x="24" y="118" font-size="14" text-anchor="start" fill="#57534e">its reason.</text>
