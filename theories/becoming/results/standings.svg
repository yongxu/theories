<text x="286" y="183" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">11 derived</text>
<text x="286" y="201" font-size="14" text-anchor="start" fill="#57534e">each a case of grammar laws, through bridges checked in Lean as equivalences and</text>
<text x="286" y="219" font-size="14" text-anchor="start" fill="#57534e">support the review reads where a row has them; the case rests on the review</text>
<text x="286" y="237" font-size="14" text-anchor="start" fill="#1c1917">For example, Flow.beyond_gives_nothing: A formation beyond the closure that takes</text>
<text x="286" y="255" font-size="14" text-anchor="start" fill="#1c1917">part at a step gives nothing at that step to a condition a member of the closure</text>
<text x="286" y="273" font-size="14" text-anchor="start" fill="#1c1917">then requires</text>
