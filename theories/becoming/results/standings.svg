<text x="286" y="165" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">11 derived</text>
<text x="286" y="183" font-size="14" text-anchor="start" fill="#57534e">each a case of grammar laws, through bridges checked in Lean as equivalences</text>
<text x="286" y="201" font-size="14" text-anchor="start" fill="#1c1917">For example, Flow.beyond_gives_nothing: what lies beyond a formation's closure is</text>
<text x="286" y="219" font-size="14" text-anchor="start" fill="#1c1917">given nothing by it</text>
<rect x="24" y="242" width="12" height="12" rx="1.5" fill="#57534e" stroke="#57534e" stroke-width="0.6"/>
<text x="286" y="253" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">1 under a stated hypothesis</text>
<text x="286" y="271" font-size="14" text-anchor="start" fill="#57534e">the root form RootForms.outside_leaves_no_offspring at one step</text>
<text x="286" y="289" font-size="14" text-anchor="start" fill="#1c1917">For example, GroupEnding.Flow.all_end: one shared condition leaves no group to</text>
<text x="286" y="307" font-size="14" text-anchor="start" fill="#1c1917">select among</text>
