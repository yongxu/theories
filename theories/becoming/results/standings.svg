<text x="286" y="467" font-size="14" text-anchor="start" fill="#1c1917">For example, RelativePosition.rise_needs_fall, in its record's law: No change</text>
<text x="286" y="485" font-size="14" text-anchor="start" fill="#1c1917">raises every part's position, and a part's rise needs another part's fall</text>
