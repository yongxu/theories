<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 962" width="900" height="962" role="img" aria-labelledby="standings-title standings-desc" font-family="Helvetica, Arial, sans-serif">
<title id="standings-title">The 117 central declarations and the grammar’s laws</title>
<desc id="standings-desc">Each square is one central declaration, a Lean statement that a row of the coverage file names as central (126 rows, nine declarations in two, so 117 distinct), placed by its standing against the edge of one root, how far the one root reaches (08 §7). 11 are read as cases of grammar laws and 1 as a root form under a stated hypothesis; the rest are counting, below the grammar, or stand at a named distance, each with its reason.</desc>
<rect x="0.5" y="0.5" width="899" height="961" rx="10" fill="#fcfcfb" stroke="#d6d3d1"/>
