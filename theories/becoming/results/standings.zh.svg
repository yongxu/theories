<text x="286" y="305" font-size="14" text-anchor="start" fill="#57534e">位于文法以下</text>
<text x="286" y="323" font-size="14" text-anchor="start" fill="#1c1917">例如 RelativePosition.rise_needs_fall：一个部分升需要另一部分降</text>
