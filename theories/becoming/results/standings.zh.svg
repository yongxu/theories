<text x="286" y="693" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">2 项为其模型之律</text>
<rect x="24" y="712" width="12" height="12" rx="1.5" fill="#e7e5e4" stroke="#57534e" stroke-width="0.6"/>
<rect x="39" y="712" width="12" height="12" rx="1.5" fill="#e7e5e4" stroke="#57534e" stroke-width="0.6"/>
<rect x="54" y="712" width="12" height="12" rx="1.5" fill="#e7e5e4" stroke="#57534e" stroke-width="0.6"/>
<text x="286" y="723" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">3 项保持意义为自由</text>
<text x="286" y="741" font-size="14" text-anchor="start" fill="#57534e">如第七章所意图</text>
<text x="24" y="768" font-size="12.5" text-anchor="start" fill="#57534e">指明的距离说的是一项声明为何不被读作文法之律的情形；根之边的记录并不表明有距离就是缺口或失败。伦理的两个前提，</text>
<text x="24" y="784" font-size="12.5" text-anchor="start" fill="#57534e">定范围的延续条件与定次序的 C，不在其中：二者都不在根之边上。</text>
<text x="24" y="804" font-size="12.5" text-anchor="start" fill="#57534e">每项声明的地位见根之边的记录（one-root-to-its-edge）：42 项有文字的依据，在其数据中，其余 75 项是规则所给的</text>
<text x="24" y="820" font-size="12.5" text-anchor="start" fill="#57534e">标签；凡其律中列有某项声明的记录，其页面印出该声明的地位及其所依。08 §7 的地位表对“陈述中有平衡”（附一例）、</text>
<text x="24" y="836" font-size="12.5" text-anchor="start" fill="#57534e">“依于数量”“为其模型之律”三类未列理由，并依 F5 已核验的项定出在一个被表示的模型上的 16 项与在其自身的载体上的</text>
<text x="24" y="852" font-size="12.5" text-anchor="start" fill="#57534e">6 项：这些项是在一个模型上陈述同一记录中某一行的定理；核心运行核验 Lean 能显示的部分，一个定理陈述的确是其</text>
<text x="24" y="868" font-size="12.5" text-anchor="start" fill="#57534e">行，是读者的判断。根之边、推导而得、指明的距离这几个词，见 GLOSSARY.zh.md。</text>
<text x="24" y="888" font-size="12.5" text-anchor="start" fill="#57534e">图中文字为 AI 所译，义以英文版为准。由 tools/research/spine.py 依 shared-laws.json 与 spine.json 画出。</text>
</svg>
