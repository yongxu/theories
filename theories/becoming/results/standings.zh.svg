<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" role="img" aria-labelledby="standings-title standings-desc" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<title id="standings-title">117 项核心声明与文法之律</title>
<desc id="standings-desc">每个方块是一项核心声明，即覆盖文件的某一行列为核心的一个 Lean 陈述，按其相对于根之边的地位排列（08 §7）。12 项被读作在文法上陈述之律的情形；其余或为计数，位于文法以下，或处于一个指明的距离，各有其理由。</desc>
<rect x="0.5" y="0.5" width="899" height="763" rx="10" fill="#fcfcfb" stroke="#d6d3d1"/>
<text x="24" y="40" font-size="22" font-weight="bold" text-anchor="start" fill="#1c1917">117 项核心声明与文法之律</text>
<text x="24" y="64" font-size="14" text-anchor="start" fill="#57534e">每个方块是一项核心声明，即覆盖文件的某一行列为核心的一个 Lean 陈述，按其相对于根之边的地位排列</text>
<text x="24" y="82" font-size="14" text-anchor="start" fill="#57534e">（08 §7）。12 项被读作在文法上陈述之律的情形；其余或为计数，位于文法以下，或处于一个指明的距离，各</text>
<text x="24" y="100" font-size="14" text-anchor="start" fill="#57534e">有其理由。</text>
