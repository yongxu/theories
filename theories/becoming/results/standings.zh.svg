<text x="286" y="165" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">11 项推导而得</text>
<text x="286" y="183" font-size="14" text-anchor="start" fill="#57534e">各为文法之律的一个情形，经由在 Lean 中作为等价核验的桥接与审阅所读的支持（某行</text>
<text x="286" y="201" font-size="14" text-anchor="start" fill="#57534e">载有它们之处）；这一情形依于该审阅，它是 AI 写成的</text>
<text x="286" y="219" font-size="14" text-anchor="start" fill="#1c1917">例如 Flow.beyond_gives_nothing：闭包之外的形成在某步在场时，在该步不向闭包成员</text>
<text x="286" y="237" font-size="14" text-anchor="start" fill="#1c1917">当时所需的条件给予（闭包指一个形成的供给闭包）</text>
<rect x="24" y="260" width="12" height="12" rx="1.5" fill="#57534e" stroke="#57534e" stroke-width="0.6"/>
<text x="286" y="271" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">1 项在一个所述的假设之下</text>
<text x="286" y="289" font-size="14" text-anchor="start" fill="#57534e">根形式 RootForms.outside_leaves_no_offspring 的一步</text>
<text x="286" y="307" font-size="14" text-anchor="start" fill="#1c1917">即 GroupEnding.Flow.all_end：一代的每个成员都不活跃时，例如每个组都依存于同一</text>
<text x="286" y="325" font-size="14" text-anchor="start" fill="#1c1917">个遭遇共同过度的条件，下一代为空</text>
<rect x="24" y="348" width="12" height="12" rx="1.5" fill="#a8a29e" stroke="#57534e" stroke-width="0.6"/>
<rect x="39" y="348" width="12" height="12" rx="1.5" fill="#a8a29e" stroke="#57534e" stroke-width="0.6"/>
