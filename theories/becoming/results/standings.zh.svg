<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 922" width="900" height="922" role="img" aria-labelledby="standings-title standings-desc" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<title id="standings-title">117 项核心声明与文法之律</title>
<desc id="standings-desc">每个方块是一项核心声明，即覆盖文件的某一行列为核心的一个 Lean 陈述（17 行共列 126 项，其中九项列了两次，故为 117 项不同的声明），按其相对于根之边（单一之根所达到之处）的地位排列（08 §7）。11 项被读作文法之律的情形，1 项被读作一个根形式的一步，在一个所述的假设之下；其余或为计数，位于文法以下，或处于一个指明的距离，各有其理由。</desc>
<rect x="0.5" y="0.5" width="899" height="921" rx="10" fill="#fcfcfb" stroke="#d6d3d1"/>
<text x="24" y="40" font-size="22" font-weight="bold" text-anchor="start" fill="#1c1917">117 项核心声明与文法之律</text>
<text x="24" y="64" font-size="14" text-anchor="start" fill="#57534e">每个方块是一项核心声明，即覆盖文件的某一行列为核心的一个 Lean 陈述（17 行共列 126 项，其中九项列</text>
<text x="24" y="82" font-size="14" text-anchor="start" fill="#57534e">了两次，故为 117 项不同的声明），按其相对于根之边（单一之根所达到之处）的地位排列（08 §7）。11</text>
<text x="24" y="100" font-size="14" text-anchor="start" fill="#57534e">项被读作文法之律的情形，1 项被读作一个根形式的一步，在一个所述的假设之下；其余或为计数，位于文法</text>
<text x="24" y="118" font-size="14" text-anchor="start" fill="#57534e">以下，或处于一个指明的距离，各有其理由。</text>
<rect x="24" y="154" width="12" height="12" rx="1.5" fill="#1c1917" stroke="#57534e" stroke-width="0.6"/>
<rect x="39" y="154" width="12" height="12" rx="1.5" fill="#1c1917" stroke="#57534e" stroke-width="0.6"/>
