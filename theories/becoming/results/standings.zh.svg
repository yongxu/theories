<text x="286" y="651" font-size="14" text-anchor="start" fill="#57534e">如第七章所意图</text>
<text x="24" y="678" font-size="12.5" text-anchor="start" fill="#57534e">指明的距离说的是一项声明为何不被读作文法之律的情形；根之边的记录并不表明有距离就是缺口或失败。伦理的两个前提，</text>
<text x="24" y="694" font-size="12.5" text-anchor="start" fill="#57534e">定范围的延续条件与定次序的 C，不在其中：二者都不在根之边上。</text>
<text x="24" y="714" font-size="12.5" text-anchor="start" fill="#57534e">由 tools/research/spine.py 依 shared-laws.json 与 spine.json 生成；每项声明及其理由，见根之边的记录</text>
<text x="24" y="730" font-size="12.5" text-anchor="start" fill="#57534e">（one-root-to-its-edge）。</text>
</svg>
