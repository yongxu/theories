<text x="286" y="147" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">11 项推导而得</text>
<text x="286" y="165" font-size="14" text-anchor="start" fill="#57534e">各为文法之律的一个情形，经由在 Lean 中作为等价核验的桥接</text>
<text x="286" y="183" font-size="14" text-anchor="start" fill="#1c1917">例如 Flow.beyond_gives_nothing：闭包之外的在任何一步都不向闭包所需的条件给予</text>
<rect x="24" y="206" width="12" height="12" rx="1.5" fill="#57534e" stroke="#57534e" stroke-width="0.6"/>
<text x="286" y="217" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">1 项在一个所述的假设之下</text>
<text x="286" y="235" font-size="14" text-anchor="start" fill="#57534e">根形式 RootForms.outside_leaves_no_offspring 的一步</text>
<text x="286" y="253" font-size="14" text-anchor="start" fill="#1c1917">例如 GroupEnding.Flow.all_end：一个共同条件不留下可供组间选择的组</text>
