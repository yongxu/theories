<rect x="99" y="348" width="12" height="12" rx="1.5" fill="#a8a29e" stroke="#57534e" stroke-width="0.6"/>
<text x="286" y="359" font-size="15" font-weight="bold" text-anchor="start" fill="#1c1917">6 项为计数</text>
<text x="286" y="377" font-size="14" text-anchor="start" fill="#57534e">位于文法以下</text>
<text x="286" y="395" font-size="14" text-anchor="start" fill="#1c1917">例如 RelativePosition.rise_needs_fall，其记录中律的话：没有一个变化使每个部分</text>
<text x="286" y="413" font-size="14" text-anchor="start" fill="#1c1917">的位置都升；一个部分升需要另一部分降</text>
<line x1="24" y1="430" x2="876" y2="430" stroke="#e7e5e4"/>
