  const en = !zh(), ids = Object.values(state.own);
  let h = '<h2>' + esc(t('own')) + '</h2><p>' + (en
    ? 'Take something you know: a fishery, a metric, a team, a model in training. In each row that applies to it, choose the box where it stands now. The map shows what leads out of each, and how each is known.'
    : '拿一件你熟悉的事：一片渔场，一个指标，一个团队，一个正在训练的模型。凡是用得上的行，各选一个它现在所在的方框。图上会显出从每个方框出去的路，以及每一条凭的是什么。') + '</p>';
  if (!ids.length) return h + '<p class="none">' + (en ? 'Nothing chosen yet. Choose a box on the chart.' : '还没有选。请在图上点一个方框。') + '</p>';
  ids.forEach(id => { const c = D.conds[id]; const out = D.passages.filter(p => p.from === id || (p.to === id && (p.kind === 'line' || p.kind === 'same')));
    h += '<h3>' + esc(nm(c)) + '</h3><p class="eg">' + esc(L(c, 'says')) + '</p>' + (out.length ? '<ul class="plist">' + out.map(p => passLi(p, p.from === id ? p.to : p.from)).join('') + '</ul>' : '<p class="none">' + esc(t('none_out')) + '</p>'); });
  const left = D.rows.filter(r => !state.own[r.id]);
  h += '<h3>' + (en ? 'Rows not answered' : '还没回答的行') + '</h3><p class="eg">' + left.map(r => esc(en ? r.en : r.zh)).join(' · ') + '</p>';
  return h + '<button class="back" id="clear">' + (en ? 'Clear the choices' : '清空选择') + '</button>';
}
function render() {
  setClasses();
  panel.innerHTML = state.mode === 'path' ? pathPanel() : state.mode === 'cond' ? condPanel() : state.mode === 'edge' ? edgePanel() : state.mode === 'case' ? casePanel() : state.mode === 'own' ? ownPanel() : allPanel();
  if (state.mode !== 'own') panel.scrollTop = 0;
  $$('#g-path button').forEach(b => b.setAttribute('aria-pressed', String(state.mode === 'path' && b.dataset.path === state.path)));
  $$('#g-case button').forEach(b => b.setAttribute('aria-pressed', String(state.mode === 'case' && b.dataset.case === state.kase)));
  $('#b-all').setAttribute('aria-pressed', String(state.mode === 'all' || state.mode === 'rows')); $('#b-own').setAttribute('aria-pressed', String(state.mode === 'own'));
  $$('#g-lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
}
let last = { mode: 'path', path: D.paths[0].id, kase: null };
function go(patch) { if (['path', 'case', 'all', 'own', 'rows'].includes(state.mode)) last = { mode: state.mode, path: state.path, kase: state.kase }; Object.assign(state, patch); render(); }
D.paths.forEach(p => $('#g-path').insertAdjacentHTML('beforeend', '<button class="chip" data-path="' + p.id + '"></button>'));
D.cases.forEach(k => $('#g-case').insertAdjacentHTML('beforeend', '<button class="chip case" data-case="' + k.id + '"></button>'));
function labels() {
  const en = !zh(), c = D.counts;
  $$('#g-path button').forEach(b => { const p = D.paths.find(x => x.id === b.dataset.path); b.textContent = en ? p.en : p.zh; });
  $$('#g-case button').forEach(b => { const k = D.cases.find(x => x.id === b.dataset.case); b.textContent = en ? k.en : k.zh; });
  $('#g-path > span').textContent = t('path_g'); $('#g-case > span').textContent = t('case_g'); $('#b-all').textContent = t('all'); $('#b-own').textContent = t('own');
  $('#eyebrow').textContent = en ? 'The theory of becoming' : '生灭变化之论';
  $('#h1').innerHTML = en ? 'The map <span class="z">地图</span>' : '地图 <span class="z">The map</span>';
  $('#lead').textContent = (en ? D.lead.en : D.lead.zh) + (en ? ' ' : '') + D.scope[state.lang];
  $('#how').textContent = en
    ? 'Each row asks one thing. Each box is one way the answer can stand. An arrow with a head is a way from one box to another; a line with a bar across it is a proved boundary between two boxes; a double line says one box is a case of the other. The line says how that is known: solid where it is proved of a stated model, dashed where it is proved only with a further premise, dotted where it is not shown in general. On a path, a hollow number marks a step that needs a further premise, or is shown only in a built example or as a reading. Choose any box or arrow.'
    : '每一行问一件事。每个方框是一种可能的回答。带箭头的线是从一个方框到另一个的路；线上有一道短杠的，是两个方框之间已证明的界线；双线表示一个方框是另一个的特例。线型标明凭什么这么说：实线是在写明的模型上已证明的；虚线是已证明、但另需一个前提；点线是没有一般证明的。路上空心的编号，标的是另需一个前提、或只见于造出来的例子、或只是一种解读的那几步。方框和箭头都可以点。';
  const lk = D.links[state.lang], a = (u, s) => '<a href=' + JSON.stringify(u) + '>' + esc(s) + '</a>';
  $('#about').innerHTML = '<p><b>' + esc(en ? 'How far it goes' : '做到了哪一步') + '.</b> ' + esc(en ? '12 November 2026. ' : '2026 年 11 月 12 日。') + esc(D.about[state.lang].lead) + '</p><div class="farwrap"><table><thead><tr>' +
    D.about[state.lang].head.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>' + D.about[state.lang].rows.map(r => '<tr>' + r.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div><p>' + esc(D.about[state.lang].rest) + '</p><p>' +
    esc(en ? 'The same as pages: ' : '同样的内容，按页读：') + a(lk.hub, en ? 'the map' : '地图') + ' · ' + a(lk.places, en ? 'every box and its arrows' : '每一个方框和它的箭头') + ' · ' +
    a(lk.paths, en ? 'the paths and the tests' : '路和检验') + ' · ' + a(lk.ledger, en ? 'the theorems and tests behind the map' : '这张图背后的定理和检验（英文）') + '</p>';
}
$('#g-path').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go({ mode: 'path', path: b.dataset.path }); });
$('#g-case').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go({ mode: 'case', kase: b.dataset.case }); });
$('#b-all').addEventListener('click', () => go({ mode: 'all' }));
$('#cropnote').addEventListener('click', () => go({ mode: 'all' }));
$('#b-own').addEventListener('click', () => go({ mode: 'own' }));
$('#g-lang').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.lang = b.dataset.lang; labels(); render(); } });
function pick(id) {
  if (state.mode === 'own') { const row = D.conds[id].row; if (state.own[row] === id) delete state.own[row]; else state.own[row] = id; render(); }
  else go({ mode: 'cond', sel: id });
}
svg.addEventListener('click', e => { const n = e.target.closest('.node'), g = e.target.closest('.edge');
  if (n) pick(n.dataset.id); else if (g) go({ mode: 'edge', edge: g.dataset.id }); });
svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.node')) { e.preventDefault(); pick(e.target.closest('.node').dataset.id); } });
panel.addEventListener('click', e => {
  if (e.target.closest('#back')) { Object.assign(state, last); render(); return; }
  if (e.target.closest('#clear')) { state.own = {}; render(); return; }
  const li = e.target.closest('[data-edge]'), lc = e.target.closest('[data-cond]'), lk = e.target.closest('[data-case]'), lw = e.target.closest('[data-web]');
  if (li) go({ mode: 'edge', edge: li.dataset.edge }); else if (lc) go({ mode: 'cond', sel: lc.dataset.cond }); else if (lk) go({ mode: 'case', kase: lk.dataset.case });
  else if (lw) { state.rows = WEB[+lw.dataset.web].rows; state.mode = 'rows'; setClasses(); }
});
function hot(step, on) {
  const path = D.paths.find(p => p.id === state.path); if (!path) return;
  $$('.tagt:not(.farl):not(.pinl)', marks).forEach(x => x.remove());
  path.sections.forEach(S => S.steps.forEach(st => { if (String(st.n) !== String(step)) return;
    st.refs.forEach(r => { if (r.p) { const g = $('.edge[data-id="' + r.p + '"]', svg); g && g.classList.toggle('hot', on); if (on) addTags([r.p]); }
      else { const n = $('.node[data-id="' + (r.c || r.stay) + '"]', svg); n && n.classList.toggle('hot', on); } }); }));
}
panel.addEventListener('mouseover', e => { const ls = e.target.closest('[data-step]'); if (ls && state.mode === 'path') hot(ls.dataset.step, true); });
panel.addEventListener('mouseout', e => { const ls = e.target.closest('[data-step]'); if (ls && state.mode === 'path') hot(ls.dataset.step, false); });
function fromHash() {
  const h = (location.hash || '').replace('#', '');
  if (D.paths.some(p => p.id === h)) Object.assign(state, { mode: 'path', path: h });
  else if (D.cases.some(k => k.id === h)) Object.assign(state, { mode: 'case', kase: h });
  else if (h === 'whole') state.mode = 'all';
  else if (h === 'own') state.mode = 'own';
  else if (h === 'zh') state.lang = 'zh';
  else if (D.conds[h.replace('-', '.')]) Object.assign(state, { mode: 'cond', sel: h.replace('-', '.') });
}
window.addEventListener('hashchange', () => { fromHash(); labels(); render(); });
fromHash(); labels(); render();
</script>
